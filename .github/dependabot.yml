version: 2
updates:
# One bundler root per gem and demo, plus "/" for the lint and security tools.
# The list matches `ls Gemfile */Gemfile`.
- package-ecosystem: bundler
  directories:
    - "/"
    - "/kiosk-all"
    - "/kiosk-core"
    - "/kiosk-demo-atablefor"
    - "/kiosk-demo-getgrocery"
    - "/kiosk-demo-hoteling"
    - "/kiosk-demo-philslist"
    - "/kiosk-demo-proveli"
    - "/kiosk-demo-skooti"
    - "/kiosk-demo-stylish"
    - "/kiosk-demo-tudu"
    - "/kiosk-kyc-proveli"
    - "/kiosk-pay-stripe"
    - "/kiosk-pow"
    - "/kiosk-pow-argon2id"
    - "/kiosk-pow-cuckoo"
    - "/kiosk-pow-equihash"
    - "/kiosk-redteam"
    - "/kiosk-reputation"
    - "/kiosk-rls"
    - "/kiosk-rls-minitest"
    - "/kiosk-rls-rspec"
    - "/kiosk-server"
    - "/kiosk-test-support"
    - "/kiosk-user-idp-devise"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
