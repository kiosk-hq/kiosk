version: 2
updates:
# Monorepo: no Gemfile at "/" — one bundler root per gem/demo (e2e generates
# its app at runtime and has no checked-in Gemfile).
#
# THE LIST MUST MATCH `ls */Gemfile` (K-884). It did not: philslist, tudu and
# prove were added after this file was written and never appended, so three
# first-class apps — all three in the CI matrix — silently got no dependency
# PRs while the comment above claimed one root per demo. `ls */Gemfile | wc -l`
# is the check; there are 22.
- package-ecosystem: bundler
  directories:
    - "/kiosk-all"
    - "/kiosk-core"
    - "/kiosk-demo-atablefor"
    - "/kiosk-demo-getgrocery"
    - "/kiosk-demo-hoteling"
    - "/kiosk-demo-philslist"
    - "/kiosk-demo-prove"
    - "/kiosk-demo-skooti"
    - "/kiosk-demo-stylish"
    - "/kiosk-demo-tudu"
    - "/kiosk-pay-stripe"
    - "/kiosk-pow"
    - "/kiosk-pow-cuckoo"
    - "/kiosk-pow-equihash"
    - "/kiosk-redteam"
    - "/kiosk-reputation"
    - "/kiosk-rls"
    - "/kiosk-rls-minitest"
    - "/kiosk-rls-rspec"
    - "/kiosk-server"
    - "/kiosk-test-support"
    - "/kiosk-user-idp-devise"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
