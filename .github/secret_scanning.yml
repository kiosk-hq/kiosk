# Secret-scanning exclusions for this repository.
#
# EXACTLY TWO PATHS, and both are development keypairs that are tracked on
# purpose. They are not credentials that leaked: they are burned by design, and
# both applications refuse to boot in production with them (each file says so in
# its own header, and each application's production environment compares the
# public half of the key it is given against the shipped one and aborts on a
# match). One of them is a published KNOWN-ANSWER VECTOR — its public half and
# one signature are reproduced in lock firmware, in a C host test and in a
# known-answer test — so it cannot be generated per machine without turning
# those red on every clone.
#
# WHAT THIS FILE IS NOT. It is not a way to quiet an alert about a real secret,
# and it is not the thing that keeps a third key out. That is
# `bin/check-publication-paths`, which fails on ANY tracked private key outside
# the two paths below and on either of these two if it loses its do-not-use
# banner — and which proves its own detector against a freshly generated key on
# every run, because an absence rule whose pattern has stopped matching reports
# the same clean zero as a clean tree. Adding a path here without adding it
# there changes nothing: CI still fails.
paths-ignore:
  - "kiosk-demo-skooti/config/dev_unlock_key.pem"
  - "kiosk-demo-prove/config/dev_prove_key.pem"
