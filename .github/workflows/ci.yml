name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# stripe-mock validates every request against ONE Stripe API version, its
# newest. The stripe gem (~> 19) sends a dahlia version, so the mock is held to
# its last dahlia release. Move this pin together with the stripe gem.
env:
  STRIPE_MOCK_VERSION: v0.205.0

jobs:
  gems:
    name: ${{ matrix.gem }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        gem:
          - kiosk-all
          - kiosk-core
          - kiosk-kyc-prove
          - kiosk-pay-stripe
          - kiosk-pow
          - kiosk-pow-cuckoo
          - kiosk-pow-equihash
          - kiosk-redteam
          - kiosk-reputation
          - kiosk-rls
          - kiosk-rls-rspec
          - kiosk-server
          - kiosk-test-support
          - kiosk-user-idp-devise
        cmd: ["bundle exec rspec"]
        include:
          - gem: kiosk-rls-minitest
            cmd: bundle exec rake test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # THREE gem jobs need a Python solver, and they do not all need the SAME
      # package. kiosk-redteam's client solves a real Equihash PoW, and
      # kiosk-pow-equihash's :parity examples live-solve the shipped 168/7
      # params to prove the solver and Ruby verifier agree end-to-end (T-013);
      # both go through the bundled numpy-vectorised solve.py, which errors
      # "this solver requires numpy" (redteam) or skips the roundtrips
      # (pow-equihash) without it. kiosk-pow is the third and numpy does it no
      # good: its packaged solve.py imports argon2.low_level and nothing else,
      # so its two :parity examples -- the only thing anywhere comparing that
      # shipped solver with the Ruby verifier beside it -- were pending in every
      # CI run this file has ever produced (K-1687).
      - name: Set up Python (PoW solvers)
        if: matrix.gem == 'kiosk-redteam' || matrix.gem == 'kiosk-pow-equihash' || matrix.gem == 'kiosk-pow'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        if: matrix.gem == 'kiosk-redteam' || matrix.gem == 'kiosk-pow-equihash'
        run: python -m pip install numpy
      - name: Install argon2-cffi (Argon2id solver)
        if: matrix.gem == 'kiosk-pow'
        run: python -m pip install argon2-cffi

      # kiosk-pay-stripe's K-492 setup-reuse spec has THREE coverage layers, and
      # until now CI ran only the weakest: the doubles/FakeStripeApi ones.
      # `stripe_integration_spec.rb` skips on purpose (no Stripe key in CI, ever)
      # and the stripe-mock group skipped silently, because stripe-mock existed
      # only on the demos matrix (getgrocery). That group is the one that pins
      # Stripe's OWN fixture shapes — that a canned list response cannot be
      # mistaken for a real outstanding setup session — so it is exactly the
      # layer that must not be optional. Same install the demos job uses; the
      # spec helper spawns the binary itself on a fixed port, so PATH is all it
      # needs (no STRIPE_MOCK_URL, no key). Without this step the suite is
      # green with 6 pending; with it, 4.
      - name: Set up stripe-mock (kiosk-pay-stripe, no key in CI)
        if: matrix.gem == 'kiosk-pay-stripe'
        run: |
          go install github.com/stripe/stripe-mock@${{ env.STRIPE_MOCK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ${{ matrix.gem }}
        run: bundle install

      - name: Run suite
        working-directory: ${{ matrix.gem }}
        env:
          # Fail-closed for the two gems this job UNDERTOOK to provision above:
          # a missing interpreter now fails by name instead of reporting pending
          # examples, which read as passing ones. The spec-side arms are inert
          # until something sets this, and nothing did until K-1687. Every other
          # matrix entry gets the empty string, because no other gem has a
          # :parity group to promise anything about.
          KIOSK_REQUIRE_PARITY: ${{ (matrix.gem == 'kiosk-pow' || matrix.gem == 'kiosk-pow-equihash') && '1' || '' }}
        run: ${{ matrix.cmd }}

  demos:
    name: ${{ matrix.demo }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: kiosk-demo-atablefor
            # Table booking, no payments. Toll at Equihash n=168 k=7, as deployed.
            tasks: check:backoff check:pow check:book check:reputation check:binding check:isolation check:redteam check:schema check:walkthrough
          - demo: kiosk-demo-getgrocery
            # check:agecheck = the alcohol 18+ age-gate (create_order rejects a
            # cart with an age_restricted item unless the agent carries
            # age_over_18) — a TWO-SERVER integration: it boots the KYC
            # broker (kiosk-demo-prove) on its own port, with getgrocery
            # registered as a SECOND broker operator, and drives the cross-app
            # KYC flow (alcohol→403→broker approve→200; non-alcohol→200 no KYC;
            # forged attestation rejected). So this job also bundles the broker.
            prove_broker: kiosk-demo-prove
            # ORDER MATTERS at both ends of this list.
            #
            # FIRST check:conformance (T-193) — the four properties the protocol
            # makes normative of an origin, asserted through `bin/rails test`:
            # every declared verb is routed with the method its kind requires,
            # the read surface executes as an authenticated principal, three
            # queries answer the shape their own output_schema declares, and
            # `my_orders` hands one principal nothing belonging to another. It is this fleet's MINITEST worked example of the
            # kiosk-test-support conformance surface (hoteling is the RSpec
            # one), and it is the only task here that runs in RAILS_ENV=test
            # against its own database, so its position is free of the reseeding
            # order that governs everything below. It needs Postgres but no
            # server, no PoW and no Stripe, ~3 s.
            # Watched fail, both proven by plant-and-restore: delete the
            # `get "/kiosk/delivery_slots"` line from config/routes/kiosk.rb and
            # the route assertion names the verb as declared and never routed —
            # nothing draws that path, so it is a 404 to every caller; replace
            # `Order.owned_by_current_principal` with `Order.all` and the
            # scoping assertion names the leaked rows.
            # LAST — check:race, the pay path's ONLY permanent regression net:
            # the K-544 double-charge/order-swap races, K-578 stuck-`paying`
            # reconciliation, and the K-579 malformed-uuid 400 over the real
            # database. It runs real threads on pooled connections against real
            # Postgres row locks, with a stub PSP (never Stripe), and it is
            # cheap — ~2.3 s locally including its own demo:setup. It goes last
            # because `task race: :setup` DROPS and reseeds the database, which
            # would pull the rug from under any task queued behind it.
            #
            # Until now none of the three was reachable from CI: the pay-path
            # invariants were pinned only by tasks a human had to remember to
            # type. Each was watched pass AND watched fail (weaken the atomic
            # claim → 6 captures under 6 racing pays; drop `paying` from
            # create_order's exclusion list → the €1.49 order becomes €1299
            # while the PSP is charged €1.49; widen Kiosk::UuidCheck::PATTERN → the
            # malformed id resurfaces as ActiveRecord::StatementInvalid).
            #
            # What is NOT wired, and why, is in the `ungated:` map below — one
            # place.
            # check:claim joins the tail for the same reason as
            # check:race — each was a real assertion battery that only ran when a
            # human remembered to type it.
            #   check:claim  the SECOND pay path (the first is check:shop): a
            #     standalone assistant is REBOUND onto the seeded human's
            #     account by the claim ceremony and then pays off_session
            #     against that human's saved card, asserted against the database
            #     (agents.user_id, settlements.user_id, the stripe_customers
            #     mapping, and the standalone order NOT migrating). It charges
            #     stripe-mock, never Stripe — no key. ~11 s.
            #     Watched fail: make AccountBinding.rebind's UPDATE a no-op on
            #     user_id and the human's pay comes back 403 "mandate principal
            #     mismatch" — the flow aborts and the task exits 1.
            # check:claim reseeds, so it sits after everything that lives off
            # the job-level demo:setup and before check:race, which stays last.
            # check:pow is getgrocery's only valid-solve->200 / wrong-nonce->403
            # pair on the catalog verb (n=96 k=5). It reseeds, so it sits with
            # check:claim.
            #   check:reconcile  T-112 — the OTHER half of the stuck-`paying`
            #     story, and the half check:race cannot reach. check:race proves
            #     the sweep heals from a settlement row and refuses to guess
            #     without one; this proves what it does with the PROCESSOR'S own
            #     answer: charged → paid, not charged → the claim released and
            #     the order payable again, no answer → UNRESOLVED with the claim
            #     kept. The first two are driven by a scripted processor, which
            #     is the only way to reach them without moving real money; the
            #     real ChargeLookup then runs against stripe-mock, whose
            #     canned PaymentIntent sits in `requires_payment_method` — a
            #     status that would release a claim on its own, and does not,
            #     because it names no cart of ours. That refusal is the whole
            #     instrument: it is what lets a demo gate assert a processor-led
            #     reconciliation with no key and no charge. It reseeds
            #     (`: "demo:setup"`), so it sits in the reseeding group; ~4 s.
            #     Watched fail: make `Kiosk::PaymentProviders::Stripe::ChargeLookup#charges_this_cart?`
            #     answer true for every intent and stripe-mock's fixture becomes
            #     proof — the order is RELEASED on a charge that is not its own,
            #     four assertions go red, exit 1.
            tasks: check:conformance check:shop check:delivery check:isolation check:redteam check:schema check:agecheck check:claim check:pow check:reconcile check:race
            ungated:
              demo:reconcile: >-
                the operator's MANUAL sweep: on a freshly seeded database it
                prints "nothing stuck" and exits 0 no matter what the code does,
                and a step that cannot go red is not a gate. Its logic is
                gated here anyway — check:reconcile for the processor's three
                answers, check:race for the local-evidence heal — both of which
                strand orders first and then sweep them.
            # getgrocery uses the real Stripe adapter. CI carries NO Stripe key
            # (never inject keys into CI); a local stripe-mock returns
            # shaped pi_ fixtures so the full flow — including check:shop's
            # off_session charge — runs secret-free. STRIPE_MOCK_URL (set by the
            # stripe-mock step below) makes demo:setup/check:schema boot, and
            # check:shop/isolation/redteam/agecheck self-start the mock process.
            stripe_mock: true
          - demo: kiosk-demo-hoteling
            # check:search is the T-042/K-452 pagination + opaque-cursor proof
            # over the ~100-hotel catalogue: a full page carries `next`, echoing
            # it back as `cursor` returns a DISJOINT page, a complete (filtered)
            # result OMITS `next`, and hotel_detail resolves a summary row's id.
            # No RFC 8628 poll timing, no key. It goes LAST
            # because `task search: :setup` reseeds. So does check:book now: it
            # was the one task here without a `: :setup`, living off the
            # job-level demo:setup, and that is exactly why a second LOCAL
            # `check:book` failed on exhausted inventory while this job stayed
            # green — it never ran the task twice (K-1044).
            # Watched fail: pin the query to `OFFSET 0` (the cursor ignored) and
            # page 2 repeats page 1 — the disjointness assertion goes red.
            #
            # check:browse is the ONLY proof anywhere that hoteling's "price
            # depth, don't ban it" model holds — the vertical's differentiator.
            # It was excluded as part of the check:pow family because it solves
            # ESCALATING browse PoW, but at the CI-default `low` difficulty
            # (n=96 k=5) that is 10 sub-second proofs plus the register proof:
            # MEASURED at 6.9 s end to end including its own reseed (K-617), i.e.
            # the same per-proof cost this workflow already pays for atablefor's
            # check:backoff, and the numpy solver is already installed below.
            # Watched fail: raise HOTELING_FREE_BROWSES above the driver's
            # BROWSES=7 and the curve stays [0,0,0,0,0,0,0] — "browsing never got
            # priced" goes red, exit 1.
            # It goes last with check:search; both reseed via `: :setup`.
            # check:conformance (T-193) goes SECOND, right after the DB-free
            # unit spec: the four properties the protocol makes normative of an
            # origin, asserted through `bundle exec rspec`. This demo is the
            # fleet's RSPEC worked example of the kiosk-test-support conformance
            # surface — getgrocery is the Minitest one — and `.rspec` sets
            # `--default-path spec/conformance` so a bare run cannot load the
            # standalone assertion script beside it, define zero examples and
            # exit 0. It is the only task in this job that runs in
            # RAILS_ENV=test against its own database, so its position is free
            # of the reseeding order that governs everything below. Postgres,
            # no server, no PoW, no PSP, ~3 s.
            # Watched fail, proven by plant-and-restore with the sha checked
            # back: replace `Booking.owned_by_current_principal` with
            # `Booking.all` and the scoping example names the leaked rows —
            # where check:isolation needs a booted origin, a seeded database and
            # a solved Equihash toll to reach the same property.
            # check:spending_cap is the ONLY thing in the fleet that exercises
            # `config.spending_cap` at all (T-154). The seam was configured
            # NOWHERE until this task — `Executor#enforce_spending_cap!` returns
            # at its first line without it — so the K-1251 fix, a cap an
            # assistant could defeat by alternating the capitalisation of its
            # currency, had a gem suite behind it and nothing that boots. hoteling
            # hosts it: one register toll, two reserves, three /pay against
            # stripe-mock, ~9 s including its own reseed.
            # Watched fail: plant the pre-K-1251 currency handling (the verifier
            # returns the raw string, the tally binds it byte-equal) and the
            # over-cap "EUR" charge SETTLES — http_pay_over_cap goes 403 → 200,
            # kiosk.settlements holds "EUR" beside "eur", exit 1. Or, the plant
            # the row itself names: raise the seeded cap above the charge and the
            # same assertion goes red with the cap-arithmetic control beside it.
            # It goes with check:search and check:browse at the end: `task
            # spending_cap: :setup` reseeds.
            tasks: check:conformance check:property_decision check:book check:isolation check:redteam check:schema check:search check:browse check:spending_cap
            # Stripe test mode; CI carries no key, so every charge and the
            # declined booking's refund go to stripe-mock.
            stripe_mock: true
          - demo: kiosk-demo-prove
            # kiosk-demo-prove — the anonymizing KYC broker (an ISSUER, not a Kiosk
            # operator; mounts none of the four verbs). check:test runs its own
            # rspec suite (intake auth + allow-list, per-request/operator/subject
            # binding, single-use, TTL, SSRF/open-relay guard, signed claim).
            tasks: check:test
          - demo: kiosk-demo-skooti
            # check:kyc = the KYC attribute gate (combustion motorcycle needs
            # age_over_18 + licence_a; the electric scooter is licence-free) — now
            # a TWO-SERVER integration: it boots the KYC broker
            # (kiosk-demo-prove) on its own port and drives the cross-app flow, as
            # does check:redteam (the broker-flavored theft/cross-operator/forged-
            # callback beats). So this job also bundles the sibling broker app.
            prove_broker: kiosk-demo-prove
            tasks: check:kat check:rideflow check:kyc check:isolation check:redteam check:schema
            stripe_mock: true
          - demo: kiosk-demo-stylish
            # check:roles is the roles-from-IdP gate, and the ONLY place the
            # prod-only K-436/K-439 class is exercised against real Devise: an
            # owner and a customer sign in through the actual /users/sign_in
            # session, and the inherited role is checked on the token, on the
            # wire (owner sees the whole book + forecast, customer only their
            # own) and against DB ground truth (kiosk.agents.allowed_roles).
            # No PoW, no poll timing, no key — ~5 s.
            # Watched fail: delete User#kiosk_role and the Devise adapter
            # resolves every real sign-in to roles.first — the three REAL DEVISE
            # assertions go red while the stub-session one still passes.
            # check:register is the registration-PoW gate (no proof → 402; ONE
            # Equihash solve at the CI-default `low` → 201; the fresh token
            # queries) — the same profile as atablefor's check:backoff, which
            # already runs here, ~4 s. Watched fail: set registration_pow_count
            # to 0 and the unproven register returns 201.
            # Both reseed (`: :setup`), so they go after check:walkthrough, which
            # has no prerequisite and lives off the job-level demo:setup.
            tasks: check:walkthrough check:isolation check:redteam check:schema check:roles check:register
            ungated:
              check:binding: >-
                timing-sensitive: the account-binding ceremony polls on the
                advertised RFC 8628 device-grant interval, which flakes on a
                shared runner. Local-only on every demo that has a poll-timed
                binding task; atablefor's check:binding carries no such timing and
                does run in CI.
          - demo: kiosk-demo-philslist
            # NON-COMMERCE classifieds board — no payments. check:walkthrough is
            # the browse→post→edit→close happy path; check:schema asserts `pay` is
            # ABSENT from the advertised capabilities (the not-only-commerce
            # proof). Same standard task set as stylish.
            # check:register is the registration-PoW gate — no proof → 402, ONE
            # Equihash solve at the CI-default `low` → 201, then the fresh token
            # posts a listing and a bad category_slug gets a clean 400 naming the
            # valid categories. Same profile as atablefor's check:backoff, ~4 s.
            # It reseeds (`: :setup`), so it goes after check:walkthrough, which
            # has no prerequisite and lives off the job-level demo:setup.
            # Watched fail: set registration_pow_count to 0 and the unproven
            # register returns 201 instead of 402.
            tasks: check:walkthrough check:isolation check:redteam check:schema check:register
            ungated:
              check:binding: >-
                timing-sensitive: the account-binding ceremony polls on the
                advertised RFC 8628 device-grant interval, which flakes on a
                shared runner — the same exclusion as stylish's.
          - demo: kiosk-demo-tudu
            # NON-COMMERCE collaborative todo — no payments. check:collab is the
            # happy path (membership-based sharing + agent→agent invites +
            # per-agent attribution + the todo/list_membership event topics,
            # live, replayed by `since`, and withdrawn on removal);
            # check:schema asserts `pay` ABSENT like
            # philslist.
            # check:link is the W5 rebind beat, and since K-783 it is the only
            # end-to-end regression for a DATA-LOSS bug: re-linking an already
            # bound key used to run tudu's assistant_claimed hook on a no-op
            # transition and DELETE every one of the human's list memberships.
            # It was excluded as "timing-sensitive on the RFC 8628 device-grant
            # poll interval, the same exclusion as the sibling check:binding
            # tasks", and that reason was simply wrong: script/link_flow.rb runs
            # the LINK-CODE ceremony (POST /auth/link → POST /auth/claim) and
            # polls nothing at all — its only sleep is a deliberate 1.1 s to
            # cross a second boundary so the JWT `iat` watermark is unambiguous.
            # stylish's and philslist's check:binding DO poll (`sleep(interval +
            # 1)` around the device-grant token poll); tudu's check:link never
            # touches that endpoint, so their exclusion does not extend to it
            # (K-786). MEASURED at 4.8 s end to end including its own reseed and
            # server boot. It reseeds (`: :setup`), like every other tudu task
            # here, so its position is free.
            tasks: check:collab check:link check:isolation check:redteam check:schema
          # Every check: task a demo defines appears either in its `tasks:`
          # list above or in its `ungated:` map with the reason it is not a gate.

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Demos register with a real Equihash PoW (numpy-vectorised solve.py),
      # so the solver needs numpy in CI.
      - name: Set up Python (Equihash solver)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        run: python -m pip install numpy

      - name: Install dependencies
        working-directory: ${{ matrix.demo }}
        run: bundle install

      # skooti's check:kyc / check:redteam and getgrocery's check:agecheck are
      # two-server integrations that boot the KYC broker (kiosk-demo-prove)
      # on its own port; that sibling app needs its own bundle installed for the
      # boot helper to `rails s` it.
      - name: Install KYC broker deps (two-server KYC gates)
        if: matrix.prove_broker
        working-directory: ${{ matrix.prove_broker }}
        run: bundle install

      # Demos self-provision a dev signing key when none is set;
      # this ephemeral key is belt-and-braces only.
      - name: Generate ephemeral signing key
        run: echo "KIOSK_SIGNING_KEY_B64=$(ruby -e 'require %{openssl}; require %{base64}; puts Base64.strict_encode64(OpenSSL::PKey::RSA.new(2048).to_pem)')" >> "$GITHUB_ENV"

      # The three demos that pay (getgrocery, hoteling, skooti): install
      # stripe-mock on PATH and advertise its URL, so the Stripe adapter runs
      # against canned pi_ fixtures with NO key. demo:setup/check:schema boot on
      # STRIPE_MOCK_URL; the charge-running tasks self-start the mock process.
      - name: Set up stripe-mock (paying demos, no key in CI)
        if: matrix.stripe_mock
        run: |
          go install github.com/stripe/stripe-mock@${{ env.STRIPE_MOCK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "STRIPE_MOCK_URL=http://127.0.0.1:12111" >> "$GITHUB_ENV"

      # Production eager-load / Zeitwerk guard — EVERY demo, EVERY push (K-513).
      #
      # K-488: a copied lib/ helper (top-level methods, no matching constant)
      # landed in three demos without the corresponding
      # `config.autoload_lib(ignore:)` entry. Every gate stayed green — demo
      # suites and flows run in development/test, where `config.eager_load` is
      # false and Zeitwerk resolves lazily — and the bug only surfaced as a
      # production boot crash that 502'd three hosted demos.
      # `zeitwerk:check` eager-loads the whole app in RAILS_ENV=production and
      # exits non-zero on the first constant/path mismatch, so it catches that
      # class in seconds. The response to K-488 was a process rule ("run this on
      # every changed demo before deploy") that lived only in a ledger row; this
      # step is that rule, enforced.
      #
      # It needs NO database — it eager-loads code, it does not connect — so it
      # runs BEFORE the Postgres client install and demo:setup and fails fast.
      # It does need the two things the production env refuses to invent:
      #   SECRET_KEY_BASE — Rails raises "Missing `secret_key_base` for
      #     'production'" during boot; a throwaway literal is enough (nothing is
      #     signed or served here).
      #   STRIPE_MOCK_URL — a paying demo's initializer aborts production boot
      #     without a Stripe key or mock URL; the stripe-mock step above already
      #     exported it for those demos (hence this step's position after it).
      #   KIOSK_POW_SECRET — K-541 made the PoW HMAC key mandatory in
      #     production, so without it every kiosk demo aborts before Zeitwerk
      #     runs (since K-650 the fetch-with-raise lives in
      #     config/environments/production.rb rather than the initializer —
      #     same abort, one file earlier). A throwaway literal is enough (no
      #     challenge is signed here).
      #   KIOSK_ISSUER — K-510 made the issuer crash-if-absent in production
      #     for the same reason, and it aborts at the same point (also moved
      #     to production.rb by K-650). The K-541 fix above added only the PoW
      #     secret, so all seven operator demos still aborted. Any
      #     syntactically valid absolute origin does; nothing is signed or
      #     dialed here.
      #   PROVE_KEY_PEM — K-673 made the broker's signing key crash-if-absent
      #     in prove's production.rb (prove only; the operator demos ignore
      #     it). It must PARSE as an RSA private key, so a literal will not do:
      #     the `run:` below mints a throwaway keypair.
      #   KIOSK_UNLOCK_SIGNING_KEY_PEM — K-686 made the Ed25519 rental-token
      #     signing key crash-if-absent in skooti's production.rb, the one demo
      #     that issues unlock tokens. It must PARSE as an Ed25519 private key,
      #     so the `run:` below mints a throwaway keypair for skooti too.
      # The signing key exported above is likewise already in the environment.
      #
      # THE TWO KEYPAIRS ARE MINTED INSIDE THIS STEP, NOT EXPORTED TO THE JOB
      # (K-756). They were written to $GITHUB_ENV by two steps of their own,
      # which is job-wide: every LATER step inherited them, including "Run demo
      # flows". skooti's server then signed rental tokens with the ephemeral
      # Ed25519 key — its dev/test env files resolve
      # `ENV.fetch("KIOSK_UNLOCK_SIGNING_KEY_PEM") { config/dev_unlock_key.pem }`
      # — while the lock simulator the flow drivers provision reads the BAKED
      # public half straight off that file (script/dev_unlock_key.rb deliberately
      # never consults ENV, because its other callers are bare-Ruby drivers).
      # Signer and verifier drifted apart, every unlock returned false, and
      # check:rideflow went red on `happy: unlocked expected true, got false`
      # for five heads. A variable that exists for ONE step belongs in that
      # step's `env:`, never in $GITHUB_ENV — the blast radius of the heredoc
      # form is the whole job, and nothing in the job says so.
      #
      # A missing one of these does NOT silently pass: `bin/rails zeitwerk:check`
      # exits 1 on the initializer's raise and this step has no
      # continue-on-error, so the job goes RED. The failure mode is not a blind
      # gate, it is a gate that reddens for a reason unrelated to eager loading
      # — which reads as "the demo is broken" and costs a maintainer the time to
      # discover it was only a missing env var. (Both omissions above went
      # unnoticed only because this workflow had not run since 2026-08-09.)
      #
      # RULE OF THUMB for the next crash-if-absent config: if a demo's
      # config/environments/production.rb (the K-650 home of such raises)
      # learns to require a new variable, add it HERE in the same commit — AND
      # in deploy/CHECKLIST.md §5, which documents this exact command for a
      # human to type before a deploy. That second half was missed when
      # KIOSK_ISSUER was added here, so the documented command aborted (exit 1,
      # "KIOSK_ISSUER is required outside development/test") on all seven
      # operator demos. The two copies are one gate written twice.
      - name: Production eager-load check (zeitwerk:check, K-488/K-513)
        working-directory: ${{ matrix.demo }}
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ci-zeitwerk-check-throwaway-secret-key-base
          KIOSK_POW_SECRET: ci-zeitwerk-check-throwaway-pow-secret-not-a-real-key
          KIOSK_ISSUER: https://ci-zeitwerk-check.example.test
          STRIPE_SECRET_KEY: sk_test_ci_zeitwerk_check
          KIOSK_PROVE_BROKER_URL: https://kyc.example.test
          KIOSK_PROVE_ISSUER: https://kyc.example.test
          KIOSK_PROVE_INTAKE_SECRET: ci-zeitwerk-check-intake-secret
        run: |
          # Keys are minted per run and never echoed.
          export KIOSK_PROVE_PUBLIC_KEY_PEM="$(ruby -e 'require "openssl"; puts OpenSSL::PKey::RSA.new(2048).public_key.to_pem')"
          if [ "${{ matrix.demo }}" = "kiosk-demo-prove" ]; then
            export PROVE_KEY_PEM="$(ruby -e 'require "openssl"; puts OpenSSL::PKey::RSA.new(2048).to_pem')"
          fi
          if [ "${{ matrix.demo }}" = "kiosk-demo-skooti" ]; then
            export KIOSK_UNLOCK_SIGNING_KEY_PEM="$(ruby -e 'require "openssl"; puts OpenSSL::PKey.generate_key("ED25519").private_to_pem')"
          fi
          bin/rails zeitwerk:check

      # The demos' check tasks query Postgres with psql; pin the client to the
      # postgres:17 service's major.
      #
      # K-795 — THIS STEP RETRIES, AND IF IT IS RED, RE-RUN IT BEFORE YOU READ
      # THE DIFF. Every command in it is a network fetch against a host we do
      # not control (apt.postgresql.org, postgresql.org, the Ubuntu mirrors),
      # and it has taken main red for a fetch that had nothing to do with the
      # tree. A red head is then indistinguishable at a glance from a real
      # regression and burns a pass re-reading a diff that was never at fault,
      # which erodes the one signal the merge gate depends on. A bounded retry
      # changes no RESULT — a persistent failure still fails the step on the
      # third attempt — it only lowers the noise floor. The runner's own "Set
      # up job" step has failed the same way and is GitHub-internal: nothing
      # here can retry it, so a red run at THAT step is re-run, not triaged.
      #
      # `set -o pipefail` is load-bearing, not tidiness: the default shell is
      # `bash -e`, so without it a failed `curl` is masked by `tee` exiting 0
      # and this step writes an EMPTY signing key — which then fails later,
      # somewhere else, as an apt signature error.
      #
      # The same three lines run in the demo-production-smoke and e2e jobs.
      # They are one fragile fetch written three times; keep them in step.
      - name: Install PostgreSQL 17 client
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list' \
               && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null \
               && sudo apt-get update -qq \
               && sudo apt-get install -y -qq postgresql-client-17; then
              exit 0
            fi
            echo "::warning::PostgreSQL 17 client install failed (attempt $attempt of 3) — environment, not the tree; retrying."
            sleep $((attempt * 10))
          done
          echo "::error::PostgreSQL 17 client could not be installed after 3 attempts."
          exit 1

      - name: Set up demo
        working-directory: ${{ matrix.demo }}
        run: bin/rails demo:setup

      - name: Run the demo's tests
        working-directory: ${{ matrix.demo }}
        run: |
          if [ -d test ]; then
            RAILS_ENV=test bin/rails db:create db:schema:load
            bin/rails test
          fi

      # Each demo task runs in its OWN bin/rails invocation. Demo servers are
      # cleaned up at_exit (process end), so batching every task into one
      # invocation leaves a later task probing a stale server booted with a
      # different env (order-dependent flake).
      - name: Run demo flows
        working-directory: ${{ matrix.demo }}
        run: |
          for task in ${{ matrix.tasks }}; do
            echo "::group::$task"
            bin/rails "$task"
            echo "::endgroup::"
          done

  # THE SKOOTI LOCK FIRMWARE'S TEST TARGETS RAN IN NO CI JOB AT ALL UNTIL THIS
  # ONE (K-1599).
  #
  # `kiosk-demo-skooti/firmware` ships the C rental-token verifier a physical
  # ESP32-C3 lock runs, and a `make` target set that holds it to the same answer
  # as the two Ruby readers of the same token. MEASURED at head before this job
  # existed, `git grep` in this repository against `HEAD`, tool and dialect
  # named: `git grep -c -i crosscheck HEAD -- .github` exited 1 with no output,
  # `git grep -c -i host_test HEAD -- .github` the same, and `git grep -n -w make
  # HEAD -- .github/workflows` returned
  # 7 lines, every one of them inside a `#` comment of the «Watched fail:» form
  # and none of them a step. So `make test` (46 C assertions), `make crosscheck`
  # (63 live-signed vectors through all three readers) and
  # `check_grammar_coverage.rb` were proved only by whoever remembered to type
  # them.
  #
  # The cost was not theoretical. K-1588, K-1590 and K-1591 were each a real
  # divergence between the shipped C verifier and the shipped Ruby readers, each
  # of them rode a green `main`, and the gate that now catches all three would
  # not have reddened a single CI run.
  #
  # WHAT IT NEEDS, stated rather than assumed: a C99 compiler and `make`, and
  # stdlib Ruby. No database, no bundle, no sibling checkout — the crosscheck
  # reads `../config/dev_unlock_key.pem` out of this repository, and the three
  # readers it drives (`firmware/verify.c`, `app/services/rental_token_issuer.rb`,
  # `script/lock_sim.rb`) require only `openssl`, `base64`, `tempfile` and
  # `securerandom`, all of them stdlib. The toolchain step installs clang when
  # the image lacks it and then prints every compiler's version, so a runner
  # image that stops shipping one fails here by name instead of by link error.
  #
  # THE COMPILERS ARE NAMED, ONCE, IN `env:` — AND THAT IS A FIX, NOT TIDYING
  # (K-1609). The first run this job ever had went red, and the reason was that
  # its two build steps used DIFFERENT compilers without either of them saying
  # so: `make test` honoured the Makefile's `CC ?= cc` (gcc on this image) while
  # `make test-asan` hard-coded `clang`. `strnlen` was undeclared for both —
  # glibc hides POSIX.1-2008 names under `-std=c99` where Apple's libc does not,
  # so the omission had been invisible on the only machine this code had ever
  # been compiled on — but gcc treats an implicit declaration as a WARNING and
  # clang 16+ as an ERROR. So `make test` BUILT AND PASSED with a call typed
  # `int (*)()` against a function returning `size_t`, and the next step failed
  # to compile the same sources. One flag list in the Makefile now covers both,
  # `-Werror=implicit-function-declaration` makes the two agree about severity,
  # and `make portability` below puts the sources through EVERY compiler on the
  # image rather than leaving a second one to be discovered by a failure.
  #
  # ITS OWN JOB RATHER THAN A LEG OF THE DEMOS MATRIX, on that matrix's own cost:
  # every demo entry boots Postgres and installs a Rails bundle, and this needs
  # neither.
  #
  # Watched fail, MEASURED 2026-09-14 by planting it rather than by reasoning:
  # drop the two `timestamp?` guards from `RentalTokenIssuer.verify` — K-1590's
  # exact pre-fix state, where `Integer(s, 10)` took a sign, underscore
  # separators and surrounding whitespace that the C parser refuses — and this
  # job's step sequence fails, `make test` exiting **2** and naming ten `int`
  # vectors the Ruby reader answers the other way. Two exit codes, because make
  # wraps them: the crosscheck runner exits 1 and make reports 2.
  #
  # Note for whoever plants the OTHER original divergence: reverting verify.c's
  # field-count loop alone leaves this job green. The `is_jti` gate added
  # afterwards refuses the same seven-field message on its own, so that axis is
  # covered twice and no single-line revert of it reddens anything.
  skooti-firmware:
    name: skooti lock firmware — C verifier vs. the two Ruby readers (make test)
    runs-on: ubuntu-latest

    # Both compilers named here rather than defaulted per step — see above.
    env:
      CC: gcc
      ASAN_CC: clang

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The C toolchain this job needs, named rather than assumed
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          "$CC" --version
          "$ASAN_CC" --version
          make --version

      - name: The coverage gate is red on a plant of every shape, and non-vacuous here
        working-directory: kiosk-demo-skooti/firmware
        run: ruby check_grammar_coverage.rb --self-test

      - name: Every compiler on this image accepts these sources (make portability)
        working-directory: kiosk-demo-skooti/firmware
        run: make portability

      - name: C host test, 3-reader grammar crosscheck, grammar coverage (make test)
        working-directory: kiosk-demo-skooti/firmware
        run: make test

      - name: The oversized-signature path under AddressSanitizer (make test-asan)
        working-directory: kiosk-demo-skooti/firmware
        run: make test-asan

  # THE DECLARED RUBY FLOOR IS NOW EXERCISED, NOT MERELY DECLARED (K-1321).
  #
  # All fourteen gemspecs declare `required_ruby_version = ">= 3.2.0"`, and until
  # this job every `setup-ruby` step in this file pinned 4.0.1 with no Ruby
  # dimension anywhere — so a published gem's advertised floor was a claim its
  # own CI contradicted by omission, and the eight demo READMEs advertise that
  # same floor.
  #
  # WHY THE FLOOR IS TESTED RATHER THAN RAISED. The other honest repair was to
  # raise `required_ruby_version` to what CI actually runs. It was rejected on
  # the numbers: `~> 8.1` railties itself declares `>= 3.2.0`, so 3.2 is the
  # framework's own floor and not an invention of ours, while a floor of 4.0
  # would exclude essentially every existing Rails app — the audience this
  # project's onboarding page is addressed to — in order to make a CI pin true.
  # Measured before the job was written, on Ruby 3.2.2 with a local Postgres:
  # all fourteen suites green, 2,526 rspec examples and 27 minitest runs, zero
  # failures. The floor was real; it was simply never run.
  #
  # THE VERSION IS DERIVED FROM A GEMSPEC AT JOB TIME, never typed here. A
  # hand-copied floor in this file is the same defect one level out: raise the
  # gemspec and this leg silently keeps testing the old number. The step also
  # asserts that all fourteen gemspecs agree, because a leg that tests one floor
  # while a sibling gem ships another is worse than no leg.
  #
  # ONE JOB, NOT A SECOND MATRIX: fourteen more runners to re-answer one
  # question is not what the question is worth. The loop keeps going after a
  # failure and reports every gem at the end, so this behaves like
  # `fail-fast: false` rather than stopping at the first.
  #
  # WHAT IT DELIBERATELY DOES NOT INSTALL: stripe-mock. That is a Go binary
  # built from source, and the group it unlocks pins Stripe's own fixture
  # shapes — not a Ruby-version question. Python + numpy IS installed, because
  # without it kiosk-redteam's client errors rather than skipping.
  ruby-floor:
    name: every gem suite on the declared Ruby floor
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Read the declared floor out of the gemspecs (never typed here)
        id: floor
        run: |
          set -uo pipefail
          floors="$(sed -n 's/.*required_ruby_version[[:space:]]*=[[:space:]]*">=[[:space:]]*\([0-9][0-9.]*\)".*/\1/p' ./*/*.gemspec | sort -u)"
          # `|| true`: grep exits 1 on zero matches, and a zero here has to reach the
          # explicit check below rather than abort the step with grep's silence --
          # which is the shape that reads like "there was nothing to test".
          count="$(printf '%s\n' "$floors" | grep -c . || true)"
          specs="$(ls ./*/*.gemspec | wc -l | tr -d ' ')"
          declared="$(grep -l required_ruby_version ./*/*.gemspec | wc -l | tr -d ' ')"
          if [ "$specs" = "0" ]; then
            echo "::error::no gemspec matched ./*/*.gemspec -- this leg would have tested nothing and exited 0." >&2
            exit 1
          fi
          echo "gemspecs: $specs, declaring a floor: $declared, distinct floors: $count ($floors)"
          if [ "$specs" != "$declared" ]; then
            echo "::error::$((specs - declared)) gemspec(s) declare no required_ruby_version; the floor is not a repository-wide fact." >&2
            exit 1
          fi
          if [ "$count" != "1" ]; then
            echo "::error::gemspecs declare $count different Ruby floors; there is no single floor for this leg to test." >&2
            exit 1
          fi
          echo "version=$floors" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby (the declared floor)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.floor.outputs.version }}
          bundler-cache: false

      # kiosk-redteam's client solves a real Equihash toll through the bundled
      # numpy solver, and kiosk-pow-equihash's :parity specs live-solve the
      # shipped params. Without numpy the first ERRORS and the second silently
      # skips, so the leg would be quieter than the 4.0.1 one for a reason that
      # has nothing to do with Ruby. This leg runs EVERY gem suite, so it owes
      # kiosk-pow's Argon2id solver its argon2-cffi for the same reason (K-1687)
      # -- and it is the half the gems matrix above cannot cover, because that
      # one gates per entry and this one does not.
      - name: Set up Python (PoW solvers)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy and argon2-cffi (PoW solvers)
        run: python -m pip install numpy argon2-cffi

      - name: Every gem suite, on the floor
        env:
          # The value the previous step DERIVED, so the assertion below compares
          # the running interpreter against the gemspecs rather than against a
          # number typed here.
          FLOOR: ${{ steps.floor.outputs.version }}
          # Both solvers are installed above, so a :parity group that cannot
          # reach one is a provisioning failure of THIS job and says so rather
          # than going quiet (K-1687). Only kiosk-pow and kiosk-pow-equihash
          # read it; the other twelve suites ignore it.
          KIOSK_REQUIRE_PARITY: "1"
        run: |
          set -uo pipefail
          ruby -v
          version="$(ruby -e 'print RUBY_VERSION')"
          # setup-ruby resolves a request into a build, and a request it cannot
          # satisfy exactly is the one way this leg could run a DIFFERENT Ruby
          # and still report success -- the whole point of the job lost in
          # silence. Compare, and say so.
          if [ "$version" != "$FLOOR" ]; then
            echo "::error::this leg is running Ruby $version but the gemspecs declare $FLOOR -- it is not testing the floor." >&2
            exit 1
          fi
          failed=""
          ran=0
          for dir in ./*/*.gemspec; do
            gem="$(basename "$(dirname "$dir")")"
            cmd="bundle exec rspec"
            if [ "$gem" = "kiosk-rls-minitest" ]; then cmd="bundle exec rake test"; fi
            echo "::group::$gem"
            ( cd "$gem" && bundle install --quiet && $cmd )
            status=$?
            echo "::endgroup::"
            ran=$((ran + 1))
            if [ $status -ne 0 ]; then
              echo "::error::$gem exited $status on Ruby $version" >&2
              failed="$failed $gem"
            fi
          done
          # A loop whose file set came out empty exits 0 and reads exactly like a
          # green tree. It cannot, here: this says so instead.
          if [ "$ran" = "0" ]; then
            echo "::error::no gem directory was visited -- this step proved nothing." >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "$ran suite(s) attempted on Ruby $version; FAILED:$failed" >&2
            exit 1
          fi
          echo "all $ran gem suite(s) green on Ruby $version, the floor every gemspec declares."

  # `spec/conformance-drift-baseline.tsv` is the anchors manifest's sibling: a
  # GENERATED file recording each anchored region's fingerprint, so a conformance
  # sweep can re-judge what MOVED instead of walking a work-list with no
  # change-detection on it. It had no staleness check of any kind, where the
  # manifest has one — and it showed: the first committed baseline's header read
  # "sampling ~185 rows blind" where its own committed generator has emitted
  # "sampling the matrix blind" since 918a56f2, so the file had been produced by a
  # draft that no longer existed and nothing in the tree could say so.
  #
  # THE MANIFEST'S RULE IS NOT THE RULE HERE, deliberately. "Equal to what the
  # generator would write at head" would force the baseline forward on every
  # commit and set the sweep interval to zero, which is exactly what the drift
  # design rejects — the lag IS the signal, and that is why no job runs the drift
  # REPORT. `--check` asks the other question: could THIS generator have written
  # THIS file? Row form and `pairs.sort` order, a header byte-equal to what the
  # generator renders from the file's own recorded values, and every fingerprint
  # re-measuring to its recorded value AT THE COMMIT THE FILE NAMES. None of that
  # looks at head, so a baseline three hundred commits behind passes exactly as
  # well as a fresh one.
  #
  # The --self-test step runs beside it because nothing else does: two of its
  # twenty arms plant the defects K-1819 records — a hand-edited fingerprint,
  # and a ref moved to the wrong commit — and until this step existed they
  # fired only when a person typed the flag.
  #
  # Stdlib Ruby only: no bundle, no services, no database, ~1 s.
  conformance-drift-baseline:
    name: the drift baseline is self-consistent (bin/check-conformance-drift --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # --check re-measures every fingerprint at the commit the baseline
          # names, which is an ANCESTOR of this head — often a long way back,
          # because the baseline is meant to lag. The default depth-1 checkout
          # does not have it, and the check would report the recorded ref as
          # "not a commit in this repository" on every run.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The generated baseline is one its own generator could have written
        run: ./bin/check-conformance-drift --check

      - name: The check is red on a plant of every arm, and non-vacuous here
        run: ./bin/check-conformance-drift --self-test

  # This repository is published out of a larger private workspace, and a
  # shipped line that cites something from that workspace is a dangling pointer
  # for every reader who will ever hold the repo. The class has now been caught
  # five times (K-1049, K-1148, K-1149, K-1153, K-1154) and never once by the
  # commit that introduced it: the only thing that asked the question lived
  # outside both published repos and ran only when a periodic sweep ran. K-1154
  # was 80 citation sites across live gem and demo code, shipping for weeks.
  #
  # bin/check-publication-paths asks it here instead, over `git ls-files`, so a
  # PR that adds one is red before it merges. Its --self-test is a step of its
  # own rather than a convention: the failure mode of a scan aimed at the wrong
  # tree is an empty file set, which exits 0 and reads exactly like a clean
  # repository, so the guard proves it is red on a plant of every pattern it
  # carries and non-vacuous over this tree before its green run means anything.
  #
  # The same file, byte for byte, is the kiosk.tech repo's guard. Nothing across
  # two repositories can enforce that, so each copy digests its own body against
  # a recorded value and reddens here when it is edited without the twin.
  #
  # Stdlib Ruby only: no bundle, no services, no database, ~10 s for both steps.
  publication-paths:
    name: nothing shipped cites what does not ship (bin/check-publication-paths)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The guard is red on a plant of every pattern, and non-vacuous here
        run: ./bin/check-publication-paths --self-test

      - name: No shipped line cites material that does not ship with this repo
        run: ./bin/check-publication-paths

  shipped-archaeology:
    name: no unresolvable citation in a shipped gem (bin/check-shipped-archaeology)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The guard is red on a plant of every shape, and non-vacuous here
        run: ./bin/check-shipped-archaeology --self-test

      - name: No ledger id and no ADR reference in what a gem ships
        run: ./bin/check-shipped-archaeology

  # ADR-0023 re-scoped a verb `description` to SEMANTICS ONLY: names, types and
  # required/optional live in the schema beside it, which is the one declaration
  # a machine can check against the handler. That clause was drained BY HAND
  # three times and each pass left live instances behind — an anchored literal
  # could not see a mid-string spelling, a case-sensitive pattern could not see
  # an uppercase one, and a `kiosk-demo-*` pathspec could not see the engine's
  # own description surface. bin/check-descriptor-prose reads the descriptors
  # STRUCTURALLY instead: every tracked .rb/.rake file parsed with Prism, each
  # property description compared with the membership its own sibling
  # `required:` array decides. No demo, controller or spelling is typed in it.
  #
  # It BANS one thing and COUNTS the rest, and which is which was measured: the
  # bare optionality LABEL is the only form in this corpus that never says
  # anything the schema does not, while `omit`, `if omitted`, `defaults to` and
  # the copula forms are overwhelmingly correct prose earlier passes kept on
  # purpose. Those are printed for a human and never reach the exit code.
  #
  # Stdlib Ruby only: no bundle, no services, no database.
  descriptor-prose:
    name: no descriptor prose restates its schema's shape (bin/check-descriptor-prose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The guard is red on every spelling of the break, and non-vacuous here
        run: ./bin/check-descriptor-prose --self-test

      - name: No property description restates its own `required:` array
        run: ./bin/check-descriptor-prose

  # The demos are eight standalone Rails apps, so shared application code is not
  # shared — it is HAND-COPIED, and until now nothing checked the copies still
  # agreed. The solver-path constant in equihash_register.rb (then at lib/, now
  # script/) was renamed in three of its five copies and nobody noticed for
  # three weeks. bin/check-demo-copies makes that
  # a red build: every relative path present in two or more demos must be
  # declared identical, identical-modulo-prose, or a deliberate per-demo variant
  # with the reason — and an UNDECLARED duplicate fails too, so a new copy cannot
  # appear silently, which is how six of them got here.
  #
  # Since K-1046 it also holds ONE FRAGMENT rather than a whole file: the
  # `<demo>_run_flow` helper K-1043 hand-copied into every demo's
  # lib/tasks/demo.rake — the directory the path rule does not scan — because a
  # block that is byte-identical in six rake files is not "per-demo by
  # construction".
  #
  # Stdlib Ruby only: no bundle, no services, no database, ~1 s for the
  # check and ~10 s for the self-test step beside it.
  demo-file-sync:
    name: duplicated demo files agree (bin/check-demo-copies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Hand-copied demo files agree, or the divergence is declared
        run: ./bin/check-demo-copies

      # Its own step, for the reason the publication-paths and
      # descriptor-prose self-tests each have one — and here the argument is the
      # COUNT. This one script holds many independent invariants behind the one
      # exit code above — how many is derived by `--self-test --list` and
      # deliberately not typed here or in the script, because a typed cardinal of
      # itself is what K-1340 found wrong twice — so a reverted regex takes one
      # of them out of service
      # while the step above stays green; K-1240 measured exactly that shape one
      # repository over. The self-test copies this checkout into throwaway
      # directories, plants one faithful break per invariant (a one-sided edit, a
      # stale `except:`, a converged copy, a claim dropped from one document),
      # and requires each to come back red NAMING its invariant. It writes
      # nothing outside its tmpdir and needs no bundle, no services and no
      # database. ~10 s (K-1267).
      - name: check-demo-copies self-test
        run: ./bin/check-demo-copies --self-test

  # Does every place a demo restates its red-team beat list still agree with the
  # beats that demo's suite actually registers? (T-078, and T-105/K-901, which
  # commissioned the same script from the same files without naming each other)
  #
  # K-709 and K-710 were this defect: six driver headers told the reader
  # registration carried no PoW while each solved one a few dozen lines below,
  # and five suite headers disagreed with the scenarios beneath them — stylish's
  # naming a beat that did not exist and omitting three that did. Both were
  # repaired by hand, and the class came back twice more: philslist's
  # two wire-shape beats arrived with the per-verb cutover and the header
  # was never updated, and the 2026-08-26 wave found a `verified` K-710 carrying
  # a verification sentence that had itself gone false. Every one of those
  # repairs corrected a hand-kept list by hand, and every gate stayed green
  # throughout, because nothing in this repository read a beat name in prose. It
  # does now — and the hour it was written it found two live omissions, one in
  # atablefor's header and one in tudu's README.
  #
  # This one compares
  # a demo's redteam PROSE — the suite header, the check:redteam rake desc, the
  # README battery section — against that demo's own suite REGISTRATIONS, and
  # since K-1482 against its ASSERTIONS too: a sentence there may not attribute
  # an HTTP status to a beat whose own implementation never names it.
  # Stdlib Ruby only: no bundle, no services, no database.
  redteam-beat-lists:
    name: redteam prose names the beats — and the statuses — that run (bin/check-redteam-headers)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Every restatement of a beat list agrees with the suite that runs it
        run: ./bin/check-redteam-headers

      # Its own step, for the reason the sibling self-tests are: two of the seven
      # rules are BANS, and a ban's violation set is EMPTY when the tree is
      # healthy, so an extractor broken by an edit leaves the bare run at exit 0
      # and says nothing. The vacuity arms assert liveness on the DECLARATIONS —
      # that the extractors still find entries to judge — rather than on the
      # violations, which is the polarity K-1262 established.
      - name: check-redteam-headers self-test
        run: ./bin/check-redteam-headers --self-test

  # A driver beat that claims a 400 REFUSAL of a named argument must read the
  # refusal's own words (T-210 item (u), from K-1762/K-1764/K-1767). The status
  # and the `code` are the OPERATOR's, whatever the app does, so a beat that
  # reads only those two ticks green for a refusal of anything else on the call
  # — measured three times in one day, once with the app guard deleted.
  # Stdlib Ruby only: no bundle, no services, no database.
  refusal-assertions:
    name: a 400-refusal beat reads the refusal's own words (bin/check-refusal-assertions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Every beat claiming a 400 refusal reads the sentence it claims
        run: ./bin/check-refusal-assertions

      # Its own step, for the sibling guards' reason: RA-1's violation set is
      # EMPTY when the tree is healthy, so an extractor broken by an edit leaves
      # the bare run at exit 0 and says nothing. The vacuity arms assert liveness
      # on the DECLARATIONS rather than on the violations (K-1262's polarity).
      - name: check-refusal-assertions self-test
        run: ./bin/check-refusal-assertions --self-test

  # Does the declarative Caddy deploy still decide correctly? (T-171, K-1295)
  #
  # THIS JOB REPLACED `deploy-edge-ratelimit`, WHICH RAN THE RETIRED
  # deploy/check-edge-ratelimit.sh. That script asserted the per-IP edge
  # throttle was PRESENT, and Phil retired the default throttle on 2026-09-05
  # («Делать по дефолту throttle - не надо»), so the assertion inverted into
  # wrong advice: run on the box it exited 1 and printed a TO FIX block telling
  # the operator to install the module and uncomment the snippet. It was not
  # inverted, because the snippet is deliberately KEPT for the day abuse
  # arrives — an inverted gate would go RED on the correct response to abuse.
  #
  # What it usefully asserted is held here instead, and each of the three was
  # checked rather than assumed: (1) the repo template must not ship the
  # limiter enabled — the same polarity as the old assertion 1, which the old
  # job's comment called "the direction that matters"; (2) the template must
  # still declare HSTS, or applying it would undo K-1295; (3) the vhost list
  # the deploy verifies must be DERIVED from the file and must be non-empty,
  # because a derivation that matches nothing makes the live verify loop pass
  # over zero hosts. The per-site "does this vhost reach the shared snippet"
  # question the old script parsed out of the config graph is now answered ON
  # THE WIRE, per host, by deploy/check-live-hsts.sh and by this script's own
  # verify_live — a parse said the config should work, a probe says the header
  # arrives.
  #
  # ONLY THE --self-test RUNS HERE, for the reason its HSTS sibling states: the
  # deploy talks to a VPS over ssh, and a build must not depend on a box this
  # repository does not deploy. The self-test touches no host and says so in
  # its own final line.
  deploy-caddy:
    name: the declarative Caddy deploy works (deploy/deploy-caddy.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: deploy-caddy self-test
        run: ./deploy/deploy-caddy.sh --self-test

  # ITS SIBLING, FOR THE OTHER HALF OF THE SAME CLASS (K-1295). The edge rate
  # limit got the script above and it landed; HSTS got a line in
  # deploy/CHECKLIST.md, which is 0 ticked of 47, so its tick state carries no
  # information at all — and MEASURED 2026-09-05, all eight deployed origins
  # send no `Strict-Transport-Security` at all while deploy/Caddyfile has
  # shipped it ENABLED since K-916. A checklist line is not a mechanism.
  #
  # ONLY THE --self-test RUNS HERE, and the omission is deliberate rather than
  # an oversight: the probe reads the LIVE fleet, so running it in CI would
  # make every build depend on a box this repository does not deploy, and it
  # would be red until a human edits /etc/caddy/Caddyfile by hand. What CI can
  # honestly hold is that the check still decides correctly — six header
  # fixtures including the measured fleet state, plus two VACUITY arms: an
  # empty host list must FAIL rather than read as an all-clear, and the
  # derivation must still find the fleet in the shipped template.
  deploy-live-hsts:
    name: the deploy HSTS probe works (deploy/check-live-hsts.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check-live-hsts self-test
        run: ./deploy/check-live-hsts.sh --self-test

  # THE THIRD OF THE SAME FAMILY, AND THE ONE THAT HOLDS THE ENV FILES.
  # /etc/kiosk-demo/*.env is driven by deploy/rollout.sh and by nothing else. The
  # real run needs a shell on a box this repository does not deploy, so what CI
  # holds is the decision, against a fake root: a box missing a value somebody
  # else holds writes nothing and exits non-zero; a box that has those values
  # converges in one run, stays converged on the next, pairs the KYC secret
  # across the two files that name it differently, and prints no secret.
  deploy-rollout:
    name: the declarative env rollout works (deploy/rollout.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: it refuses a wiped box, then converges and stays converged
        run: |
          export KIOSK_ENV_DIR=$RUNNER_TEMP/kiosk-demo KIOSK_SRC=$PWD
          export KIOSK_OWNER="$(id -un):$(id -gn)"
          mkdir -p "$KIOSK_ENV_DIR"
          ! ./deploy/rollout.sh
          [ -z "$(ls -A "$KIOSK_ENV_DIR")" ]
          for u in atablefor getgrocery hoteling philslist skooti stylish tudu prove; do
            echo "KIOSK_$(echo "$u" | tr a-z A-Z)_DB_PASSWORD=pw-$u" >"$KIOSK_ENV_DIR/$u.env"
          done
          for u in getgrocery hoteling skooti; do echo 'STRIPE_SECRET_KEY=sk_test_ci' >>"$KIOSK_ENV_DIR/$u.env"; done
          printf 'KIOSK_UNLOCK_SIGNING_KEY_PEM="%s"\n' "$(openssl genpkey -algorithm ed25519)" >>"$KIOSK_ENV_DIR/skooti.env"
          printf 'PROVE_KEY_PEM="%s"\n' "$(openssl genrsa 2048 2>/dev/null)" >>"$KIOSK_ENV_DIR/prove.env"
          ./deploy/rollout.sh
          ! ./deploy/rollout.sh | grep -q '^wrote'
          ! ./deploy/rollout.sh | grep -q 'pw-tudu'
          s=$(sed -n 's/^KIOSK_PROVE_INTAKE_SECRET=//p' "$KIOSK_ENV_DIR/skooti.env")
          [ -n "$s" ] && grep -qx "KIOSK_PROVE_SKOOTI_SECRET=$s" "$KIOSK_ENV_DIR/prove.env"
          [ "$(stat -c '%U:%G %a' "$KIOSK_ENV_DIR/tudu.env")" = "$KIOSK_OWNER 640" ]

  # THE PUBLISHED ARTEFACTS — the one job that checks kiosk.tech out beside this
  # repo, because it compares this tree's skill pins against published BYTES.
  #
  # Every demo initializer pins `skill_url` + `skill_sha256`, and that pair is the
  # entire supply-chain instruction an AI assistant gets: fetch this file, verify
  # this digest, refuse it on a mismatch. Sibling-less, nothing can compare them.
  #
  # `kiosk-hq/kiosk.tech` is a PUBLIC repository, so the default GITHUB_TOKEN
  # clones it, and a published `skill-vX.Y.Z.md` is never edited
  # (kiosk.tech/bin/check-skill-immutability enforces it in that repo), so this
  # job compares against a fixed artefact rather than a moving branch.
  #
  # PUSH kiosk.tech FIRST: this job requires the cut to be on kiosk.tech's
  # default branch before this repo's pins point at it. In the other order the
  # pins name a file the world cannot fetch.
  #
  # THE STEPS, and each one is dead without the sibling:
  #   * skill_pin_spec.rb — every demo's `skill_sha256` against the SHA-256 of
  #     the file its `skill_url` names, the engine default naming that same
  #     published artefact, and the pinned cut bounding its device-code poll.
  #     `KIOSK_REQUIRE_SITE_SIBLING=1` makes an absent sibling a FAILURE rather
  #     than pending examples.
  #   * bin/check-live-skill-pin (offline, no network) — that the cut every demo
  #     pins is the NEWEST one published. Its --network mode is a manual
  #     deploy-time tool and must NOT be wired anywhere: it compares the LIVE
  #     fleet against the working tree, and those differ until the next deploy.
  published-bytes:
    name: skill pins vs the published bytes (kiosk.tech sibling)
    runs-on: ubuntu-latest

    steps:
      # The umbrella layout, reproduced: this repo and kiosk.tech as siblings.
      # Every script below resolves the site as `../kiosk.tech` from its own
      # repository root, so the two paths here are load-bearing.
      - uses: actions/checkout@v7
        with:
          path: reference

      - uses: actions/checkout@v7
        with:
          repository: kiosk-hq/kiosk.tech
          path: kiosk.tech

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Fails loudly rather than letting the steps below decide for
      # themselves that there is nothing to compare. Each of them is written to
      # degrade politely when the sibling is missing — correct for a developer's
      # single-repo clone, and exactly what must not happen here.
      - name: The sibling is really there
        run: |
          set -eu
          test -d kiosk.tech/spec/schemas
          cuts=$(ls kiosk.tech/skill-v*.md | wc -l)
          test "$cuts" -gt 0
          echo "kiosk.tech checked out: $cuts published skill cut(s), spec/schemas present"

      - name: Install dependencies
        working-directory: reference/kiosk-test-support
        run: bundle install

      - name: Every pinned skill_sha256 is the digest of the published cut
        working-directory: reference/kiosk-test-support
        env:
          KIOSK_REQUIRE_SITE_SIBLING: "1"
        run: bundle exec rspec spec/skill_pin_spec.rb

      - name: The cut the demos pin is the newest one published
        working-directory: reference
        run: ./bin/check-live-skill-pin --offline

      - name: The shipped solver is the solver the newest cut pins
        working-directory: reference
        env:
          KIOSK_REQUIRE_SITE_SIBLING: "1"
        run: ./bin/check-solver-pin

  # Before 1.0 every gem, lockfile entry, API_VERSION, MIN_CLIENT and skill pin
  # carries the same MAJOR.MINOR.PATCH (protocol.md §14.1).
  version-parity:
    name: version parity (bin/check-version-parity)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Gems, lockfiles and skill pins carry the protocol version
        run: ./bin/check-version-parity

  # Changelog structure, and every entry newer than the script's baseline commit
  # is under 200 characters and at most two sentences. The baseline is read from
  # history, so the checkout is full.
  changelog-structure:
    name: changelogs answer each kind once, new entries are short (bin/check-changelog)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The script is red on a plant of every arm
        run: ./bin/check-changelog --self-test

      - name: Every changelog is well-formed and every new entry is short
        run: ./bin/check-changelog

  # A count typed into prose is a claim with no owner: true the day it is
  # written, and nothing notices when the thing it counts changes. K-1202 elided
  # twelve of them; K-1205 — a different wave in the same session — re-typed
  # four, one in the file K-1202 had just repaired; K-1221 then found one that
  # was not merely unguarded but WRONG, telling an operator the proof-of-work
  # flow solves four proofs where the run solves one. Every one was found by a
  # human eye, weeks late, because nothing in this repository reads a numeral.
  #
  # bin/check-prose-counts reads them. A count may carry a marker naming the
  # command that re-derives it — `<!-- count: N ¦ from: … -->` — and every
  # declared command is RUN and compared, printing both numbers on a mismatch.
  # Beside that it censuses shipped prose (Markdown, environment templates, Rake
  # task descriptions) newline-normalised, because a line-based scan cannot see a
  # wrapped sentence and that blindness cost two repair waves a site each; a
  # count that is neither declared nor allow-listed with a reason fails.
  #
  # Attribution is scoped to the SENTENCE, never to a character window, and that
  # is K-1222: the sweep this inherits used ±320 characters and certified a
  # defective sentence because an unrelated «Requires python3 + numpy.» line fell
  # inside it, while that sentence's byte-identical twin failed the same test.
  # The --self-test plants a marker 146 characters from the count it claims and
  # requires the guard to stay red, so that lesson is executable rather than
  # remembered.
  #
  # Ruby COMMENTS are reported and not gated — 465 hits against 83 gated, and an
  # allow-file with 465 entries stops being read. The number is printed on every
  # run so the ungated half stays visible. Stdlib Ruby only: no bundle, no
  # services, no database, ~1 s for both steps; the declared commands are
  # `git ls-files`, `grep` and `sed` over this checkout.
  prose-counts:
    name: counts in prose re-derive (bin/check-prose-counts)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: The guard is red on a plant of every arm, and non-vacuous here
        run: ./bin/check-prose-counts --self-test

      - name: Every declared count agrees with the command that re-derives it
        run: ./bin/check-prose-counts

  # Production-boot smoke — the guard for the prod-only bug class that the
  # dev-mode gems/demos/e2e jobs are all blind to. Three shipped bugs (K-422
  # eager-load Zeitwerk crash, K-436 missing governance columns → manage-page
  # 500, K-439 assume_ssl off → CSRF-Origin silent sign-in failure) ALL reached
  # the hosted demos and none tripped CI, because CI boots the server in
  # RAILS_ENV=development (lazy autoload, no proxy, no Origin check). This boots
  # ONE demo per UNIQUE human-facing HTML surface exactly like the deploy:
  # RAILS_ENV=production (config.eager_load=true, config.assume_ssl=true) behind
  # a simulated proxy+browser, and curl-asserts the surfaces those bugs broke:
  #   stylish — Devise sign-in, roles, the manage page (the original three-bug
  #             surface).
  #   prove   — the KYC broker's /verify human page (K-462): a distinct
  #             token-capability HTML surface with a form POST and no login,
  #             depending on no kiosk gem. The stylish-only smoke never covered
  #             it.
  #   tudu    — the housemate board `/shared` and the fleet's only open sign-up
  #             (K-1085). «One demo per unique surface» rested on «the prod-only
  #             classes are per-surface, not per-app», and that is false for the
  #             K-436 class this script was built for: tudu's `/shared` is the
  #             fleet's only HTML page rendered from a hand-written `exec_query`,
  #             so its column set is per-APP by construction.
  # Booting all seven in prod would still be heavier CI for little marginal
  # signal. See deploy/production-smoke.sh; any assertion miss fails the job.
  demo-production-smoke:
    name: production-boot smoke (stylish + prove + tudu)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # database.yml (production) connects as this role; the postgres service
      # runs trust auth as `postgres`, so no password is needed.
      KIOSK_STYLISH_DB_USER: postgres
      KIOSK_STYLISH_DB_PASSWORD: ""
      # Same for the KYC broker's production database.yml.
      KIOSK_PROVE_DB_USER: postgres
      KIOSK_PROVE_DB_PASSWORD: ""
      # ...and for tudu's (K-1085).
      KIOSK_TUDU_DB_USER: postgres
      KIOSK_TUDU_DB_PASSWORD: ""
      # The smoke DROPS and rebuilds its database (a throwaway `kiosk_<app>_smoke`
      # that no deployment provisions), so it refuses to run unless the caller
      # states the target is disposable — see the safety header in
      # deploy/production-smoke.sh (K-594). GitHub already sets CI=true, which
      # the script also accepts; stating it here keeps the workflow explicit and
      # independent of that ambient variable. Never set this on a deploy host —
      # there the script refuses regardless, and this variable does not override
      # that.
      KIOSK_SMOKE_I_AM_DISPOSABLE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install stylish dependencies
        working-directory: kiosk-demo-stylish
        run: bundle install

      - name: Install KYC broker dependencies
        working-directory: kiosk-demo-prove
        run: bundle install

      # tudu was added to this job by K-1085 without its own bundle install, so
      # a fresh runner booted it against uninstalled gems (GemNotFound) — the
      # K-681 local-green-≠-runner-green shape, one step below the stylish/prove
      # pair. This step is that missing install (K-1156).
      - name: Install tudu dependencies
        working-directory: kiosk-demo-tudu
        run: bundle install

      # psql pinned to the service's major, as in the demos job.
      # Retries for the reason written out on the demos job's copy (K-795).
      - name: Install PostgreSQL 17 client
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list' \
               && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null \
               && sudo apt-get update -qq \
               && sudo apt-get install -y -qq postgresql-client-17; then
              exit 0
            fi
            echo "::warning::PostgreSQL 17 client install failed (attempt $attempt of 3) — environment, not the tree; retrying."
            sleep $((attempt * 10))
          done
          echo "::error::PostgreSQL 17 client could not be installed after 3 attempts."
          exit 1

      # Boot stylish in production and run the four proxy+browser assertions.
      # The script self-provides SECRET_KEY_BASE + KIOSK_SIGNING_KEY_B64 + the
      # K-541 KIOSK_POW_SECRET (the production initializer self-provisions none
      # of them and refuses to boot without them) on a fixed, collision-free port.
      - name: Production-boot smoke (stylish)
        run: ./deploy/production-smoke.sh stylish

      # Boot the KYC broker in production and assert its /verify HTML page
      # (live form + clean not-recognised + form POST behind the proxy) renders
      # rather than 500 — the K-462 gap the stylish-only smoke did not cover.
      - name: Production-boot smoke (KYC broker)
        run: ./deploy/production-smoke.sh prove

      # Boot tudu in production and assert its housemate board (`/shared`) and
      # its open sign-up render — the hand-written-SQL-projection surface and
      # the only open Devise registration in the fleet, both among the four
      # pages the live box answered 500 on (K-1085, K-1074).
      - name: Production-boot smoke (tudu)
        run: ./deploy/production-smoke.sh tudu

  e2e:
    name: kiosk OSS end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install Rails
        run: gem install rails --no-document

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # e2e/requirements.txt is the harness's one declaration of what its python
      # needs: numpy for the register-time Equihash solver (solve.py errors
      # "this solver requires numpy" without it) and websockets for the PINNED
      # event-stream listener (kiosk-server/listen.py). A human with a fresh
      # clone installs the same file.
      - name: Set up Python (Equihash solver + event listener)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the e2e harness's python dependencies
        run: python -m pip install -r e2e/requirements.txt

      # Retries for the reason written out on the demos job's copy (K-795).
      - name: Install PostgreSQL 17 client (postgres:17 service)
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list' \
               && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null \
               && sudo apt-get update -qq \
               && sudo apt-get install -y -qq postgresql-client-17; then
              exit 0
            fi
            echo "::warning::PostgreSQL 17 client install failed (attempt $attempt of 3) — environment, not the tree; retrying."
            sleep $((attempt * 10))
          done
          echo "::error::PostgreSQL 17 client could not be installed after 3 attempts."
          exit 1

      # The pay flow charges stripe-mock through kiosk-pay-stripe; no key.
      - name: Set up stripe-mock (e2e pay flow, no key in CI)
        run: |
          go install github.com/stripe/stripe-mock@${{ env.STRIPE_MOCK_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run e2e
        run: ./e2e/run.sh
