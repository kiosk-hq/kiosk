name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily, for the `solver-pin-live` job ONLY (every other job is skipped on a
  # schedule run — see its `if:`). That job probes what kiosk.tech actually
  # serves, and kiosk.tech is a SEPARATE repo: a commit there can break the
  # solver pin without ever triggering this repo's CI, so a push-triggered
  # check would not catch the drift direction that matters most.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  gems:
    name: ${{ matrix.gem }}
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        gem:
          - kiosk-all
          - kiosk-core
          - kiosk-pay-stripe
          - kiosk-pow
          - kiosk-pow-cuckoo
          - kiosk-pow-equihash
          - kiosk-redteam
          - kiosk-reputation
          - kiosk-rls
          - kiosk-rls-rspec
          - kiosk-server
          - kiosk-test-support
          - kiosk-user-idp-devise
        cmd: ["bundle exec rspec"]
        include:
          - gem: kiosk-rls-minitest
            cmd: bundle exec rake test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Two gem jobs need the bundled numpy-vectorised solver (solve.py):
      # kiosk-redteam's client solves a real Equihash PoW, and
      # kiosk-pow-equihash's :parity specs live-solve the shipped 168/7 params
      # to prove the solver and Ruby verifier agree end-to-end (T-013). Without
      # numpy solve.py errors "this solver requires numpy" (redteam) or the
      # :parity roundtrips silently skip (pow-equihash), so install it for both.
      - name: Set up Python (Equihash solver)
        if: matrix.gem == 'kiosk-redteam' || matrix.gem == 'kiosk-pow-equihash'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        if: matrix.gem == 'kiosk-redteam' || matrix.gem == 'kiosk-pow-equihash'
        run: python -m pip install numpy

      # kiosk-pay-stripe's K-492 setup-reuse spec has THREE coverage layers, and
      # until now CI ran only the weakest: the doubles/FakeStripeApi ones.
      # `stripe_integration_spec.rb` skips on purpose (no Stripe key in CI, ever)
      # and the stripe-mock group skipped silently, because stripe-mock existed
      # only on the demos matrix (getgrocery). That group is the one that pins
      # Stripe's OWN fixture shapes — that a canned list response cannot be
      # mistaken for a real outstanding setup session — so it is exactly the
      # layer that must not be optional. Same install the demos job uses; the
      # spec helper spawns the binary itself on a fixed port, so PATH is all it
      # needs (no STRIPE_MOCK_URL, no key). Without this step the suite is
      # green with 6 pending; with it, 4.
      - name: Set up stripe-mock (kiosk-pay-stripe, no key in CI)
        if: matrix.gem == 'kiosk-pay-stripe'
        run: |
          go install github.com/stripe/stripe-mock@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ${{ matrix.gem }}
        run: bundle install

      - name: Run suite
        working-directory: ${{ matrix.gem }}
        run: ${{ matrix.cmd }}

  demos:
    name: ${{ matrix.demo }}
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: kiosk-demo-atablefor
            # Restaurant table-booking: NO
            # payments — demo:book is the headline ("book a table for 2"),
            # demo:schema asserts pay ABSENT (capabilities [schema,query,run]).
            # demo:binding is the human-IdP + account-linking beat (a diner links
            # their assistant via the real Devise session, and the assistant's
            # booking ties to the diner's account); unlike the sibling binding
            # demos it carries no RFC 8628 poll timing, so it runs in CI.
            # demo:backoff is PoW-only (no RFC 8628 timing) and solves exactly
            # ONE small Equihash proof at the CI-default `low` difficulty (n=96
            # k=5, sub-second) before asserting the count-based grant, so it runs
            # in CI. demo:rls moved to getgrocery.
            # demo:walkthrough is the curl tour of the wire surface (bin/demo):
            # no PoW, no RFC 8628 timing, no key — the same profile as the
            # stylish/philslist walkthroughs already here, ~4 s. It was the one
            # walkthrough no gate reached (K-618). It is NOT redundant with
            # demo:book: watched fail — point db/seeds.rb's WALKTHROUGH_STUB_USER_ID
            # at a uuid with no users row and book_table comes back an
            # ActiveRecord::InvalidForeignKey error envelope, so the tour exits 1
            # while demo:book, which registers its own agent, stays green.
            # It goes LAST because `task walkthrough: :setup` reseeds, while
            # demo:backoff and demo:book have no prerequisite and live off the
            # job-level demo:setup.
            tasks: demo:backoff demo:book demo:binding demo:isolation demo:redteam demo:schema demo:walkthrough
            # Tasks deliberately NOT gated, and why. bin/check-ci-tasks fails the
            # build if a demo: task is in neither this map nor `tasks:` above.
            ungated:
              demo:pow: >-
                the heavy anti-scalping toll — it solves real memory-hard
                Equihash batteries, not the single sub-second register proof
                demo:backoff pays. demo:pow is excluded on every demo.
              demo:reputation: >-
                same heavy-PoW family as demo:pow — it solves several escalating
                Equihash tolls to show the cost dropping as bookings accrue.
          - demo: kiosk-demo-getgrocery
            # demo:agecheck = the alcohol 18+ age-gate (create_order rejects a
            # cart with an age_restricted item unless the agent carries
            # age_over_18) — a TWO-SERVER integration: it boots the KYC
            # broker (kiosk-demo-prove) on its own port, with getgrocery
            # registered as a SECOND broker operator, and drives the cross-app
            # KYC flow (alcohol→403→broker approve→200; non-alcohol→200 no KYC;
            # forged attestation rejected). So this job also bundles the broker.
            prove_broker: kiosk-demo-prove
            # ORDER MATTERS at both ends of this list.
            #
            # FIRST — the two DB-free unit specs (~0.5 s each, no server, no
            # Postgres, no PoW): they fail in under a second on the cheapest
            # possible signal.
            #   demo:slots_spec   K-480 delivery-slot past-filter across DST.
            #   demo:cashier_spec K-579 order-reference shape guard.
            # The two telemetry tasks ride with them (~2 s together, no server,
            # no PoW, no Stripe, no network — they only need the job-level
            # demo:setup to have created a database; neither needs the seed and
            # neither reseeds). Between them they are the ONLY executable check
            # anywhere of lib/demo_telemetry.rb, which is copied byte-for-byte
            # into all seven operator demos and is best-effort by design:
            # DemoTelemetry.record, .aggregates and the middleware each
            # `rescue StandardError` and carry on, so a broken telemetry module
            # does not raise anywhere — it silently records nothing while the
            # landing tile reads zeros. These tasks' assertions are what convert
            # that swallowed failure into a red build.
            #   demo:telemetry      the STORE round-trip (K-620): simulate!
            #     writes rows, aggregates reads them back populated.
            #     Watched fail: rename the `at` column in DemoTelemetry.record's
            #     INSERT (a drift against deploy/telemetry-init.sql) and every
            #     insert is swallowed — `simulate!` still prints "wrote 40 rows"
            #     while the aggregate comes back all-zero, and the task exits 1.
            #     Honest scope: it seeds its own rows and reads them back, so it
            #     gates the store round-trip, not any Kiosk wire behaviour.
            #   demo:telemetry_spec the REQUEST path (K-622) — the half
            #     demo:telemetry never touches, and the half that runs in
            #     production. Three processes: the DB-free middleware spec, then
            #     GET /demo/activity.json under a real boot with KIOSK_TELEMETRY=1
            #     and again with it unset (route drawn / middleware inserted are
            #     boot-time decisions, so presence and absence need two boots).
            #     Watched fail: it was WRITTEN red — before the fix the
            #     middleware's outer rescue recovered from a post-dispatch raise
            #     by calling @app.call(env) again, and 5 assertions failed on
            #     calls==2 (a replayed /auth/register mints a second agent).
            #     Also watched fail by mutation on the controller side: drop the
            #     Access-Control-Allow-Origin header, or make ?scope=app fall
            #     through to the all-apps aggregate, and 5 assertions go red.
            # Both WRITE, so their write target is guarded IN THE TASK/SPEC rather
            # than by this workflow happening not to set KIOSK_TELEMETRY_DB_URL:
            # with that variable set they abort unless SEED_SHARED=1, so a future
            # workflow edit cannot quietly seed synthetic activity into the shared
            # hosted store behind the public kiosk.tech landing tile.
            #
            # LAST — demo:race, the pay path's ONLY permanent regression net:
            # the K-544 double-charge/order-swap races, K-578 stuck-`paying`
            # reconciliation, and the K-579 malformed-uuid 400 over the real
            # database. It runs real threads on pooled connections against real
            # Postgres row locks, with a stub PSP (never Stripe), and it is
            # cheap — ~2.3 s locally including its own demo:setup. It goes last
            # because `task race: :setup` DROPS and reseeds the database, which
            # would pull the rug from under any task queued behind it.
            #
            # Until now none of the three was reachable from CI: the pay-path
            # invariants were pinned only by tasks a human had to remember to
            # type. Each was watched pass AND watched fail (weaken the atomic
            # claim → 6 captures under 6 racing pays; drop `paying` from
            # create_order's exclusion list → the €1.49 order becomes €1299
            # while the PSP is charged €1.49; widen UuidCheck::PATTERN → the
            # malformed id resurfaces as ActiveRecord::StatementInvalid).
            #
            # What is NOT wired, and why, is in the `ungated:` map below — one
            # place, checked by bin/check-ci-tasks rather than remembered.
            # demo:claim and demo:rls join the tail for the same reason as
            # demo:race — each was a real assertion battery that only ran when a
            # human remembered to type it.
            #   demo:claim  the SECOND pay path (the first is demo:shop): a
            #     standalone assistant is REBOUND onto the seeded human's
            #     account by the claim ceremony and then pays off_session
            #     against that human's saved card, asserted against the database
            #     (agents.user_id, settlements.user_id, the stripe_customers
            #     mapping, and the standalone order NOT migrating). It charges
            #     stripe-mock, never Stripe — no key. ~11 s.
            #     Watched fail: make AccountBinding.rebind's UPDATE a no-op on
            #     user_id and the human's pay comes back 403 "mandate principal
            #     mismatch" — the flow aborts and the task exits 1.
            #   demo:rls    the suite's ONLY RLS *enforcement* proof. The
            #     kiosk-rls gem suite (in the gems matrix) tests the emitter; it
            #     is this overlay that proves FORCE + non-owner role-drop
            #     actually blocks a raw cross-tenant SELECT, with the
            #     owner/superuser leak as the negative control. ~3 s.
            #     Watched fail: widen the SELECT policy to `USING (true)` and
            #     both enforced sessions see 2 rows instead of 1.
            # Both reseed (demo:claim invokes demo:setup, demo:rls does its own
            # drop/create/load/seed), so they sit AFTER everything that lives off
            # the job-level demo:setup and BEFORE demo:race, which stays last.
            # demo:rls leaves RLS applied to `orders`; demo:race's `: :setup`
            # drops the database, which is what clears it — do not reorder them.
            tasks: demo:slots_spec demo:cashier_spec demo:telemetry demo:telemetry_spec demo:shop demo:isolation demo:redteam demo:schema demo:agecheck demo:claim demo:rls demo:race
            ungated:
              demo:pow: >-
                the catalog toll — it solves real memory-hard Equihash
                batteries. demo:pow is excluded on every demo.
              demo:reconcile: >-
                the operator's MANUAL sweep: on a freshly seeded database it
                prints "nothing stuck" and exits 0 no matter what the code does,
                and a step that cannot go red is not a gate (K-616). Its logic is
                gated here anyway, by demo:race's K-578 block, which strands
                orders first and then sweeps.
            # getgrocery uses the real Stripe adapter. CI carries NO Stripe key
            # (never inject keys into CI); a local stripe-mock returns
            # shaped pi_ fixtures so the full flow — including demo:shop's
            # off_session charge — runs secret-free. STRIPE_MOCK_URL (set by the
            # stripe-mock step below) makes demo:setup/demo:schema boot, and
            # demo:shop/isolation/redteam/agecheck self-start the mock process.
            stripe_mock: true
          - demo: kiosk-demo-hoteling
            # demo:search is the T-042/K-452 pagination + opaque-cursor proof
            # over the ~100-hotel catalogue: a full page carries `next`, echoing
            # it back as `cursor` returns a DISJOINT page, a complete (filtered)
            # result OMITS `next`, and hotel_detail resolves a summary row's id.
            # No PoW, no RFC 8628 poll timing, no key — ~5 s. It goes LAST
            # because `task search: :setup` reseeds, while demo:book has no
            # prerequisite and lives off the job-level demo:setup.
            # Watched fail: pin the query to `OFFSET 0` (the cursor ignored) and
            # page 2 repeats page 1 — the disjointness assertion goes red.
            #
            # demo:browse is the ONLY proof anywhere that hoteling's "price
            # depth, don't ban it" model holds — the vertical's differentiator.
            # It was excluded as part of the demo:pow family because it solves
            # ESCALATING browse PoW, but at the CI-default `low` difficulty
            # (n=96 k=5) that is 10 sub-second proofs plus the register proof:
            # MEASURED at 6.9 s end to end including its own reseed (K-617), i.e.
            # the same per-proof cost this workflow already pays for atablefor's
            # demo:backoff, and the numpy solver is already installed below.
            # Watched fail: raise HOTELING_FREE_BROWSES above the driver's
            # BROWSES=7 and the curve stays [0,0,0,0,0,0,0] — "browsing never got
            # priced" goes red, exit 1.
            # It goes last with demo:search; both reseed via `: :setup`.
            tasks: demo:book demo:isolation demo:redteam demo:schema demo:search demo:browse
          - demo: kiosk-demo-prove
            # kiosk-demo-prove — the anonymizing KYC broker (an ISSUER, not a Kiosk
            # operator; mounts none of the four verbs). demo:test runs its own
            # rspec suite (intake auth + allow-list, per-request/operator/subject
            # binding, single-use, TTL, SSRF/open-relay guard, signed claim).
            tasks: demo:test
          - demo: kiosk-demo-skooti
            # demo:kyc = the KYC attribute gate (combustion motorcycle needs
            # age_over_18 + licence_a; the electric scooter is licence-free) — now
            # a TWO-SERVER integration: it boots the KYC broker
            # (kiosk-demo-prove) on its own port and drives the cross-app flow, as
            # does demo:redteam (the broker-flavored theft/cross-operator/forged-
            # callback beats). So this job also bundles the sibling broker app.
            prove_broker: kiosk-demo-prove
            tasks: demo:kat demo:rideflow demo:kyc demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-stylish
            # demo:roles is the roles-from-IdP gate, and the ONLY place the
            # prod-only K-436/K-439 class is exercised against real Devise: an
            # owner and a customer sign in through the actual /users/sign_in
            # session, and the inherited role is checked on the token, on the
            # wire (owner sees the whole book + forecast, customer only their
            # own) and against DB ground truth (kiosk.agents.allowed_roles).
            # No PoW, no poll timing, no key — ~5 s.
            # Watched fail: delete User#kiosk_role and the Devise adapter
            # resolves every real sign-in to roles.first — the three REAL DEVISE
            # assertions go red while the stub-session one still passes.
            # demo:register is the registration-PoW gate (no proof → 402; ONE
            # Equihash solve at the CI-default `low` → 201; the fresh token
            # queries) — the same profile as atablefor's demo:backoff, which
            # already runs here, ~4 s. Watched fail: set registration_pow_count
            # to 0 and the unproven register returns 201.
            # Both reseed (`: :setup`), so they go after demo:walkthrough, which
            # has no prerequisite and lives off the job-level demo:setup.
            tasks: demo:walkthrough demo:isolation demo:redteam demo:schema demo:roles demo:register
            ungated:
              demo:binding: >-
                timing-sensitive: the account-binding ceremony polls on the
                advertised RFC 8628 device-grant interval, which flakes on a
                shared runner. Local-only on every demo that has a poll-timed
                binding task; atablefor's demo:binding carries no such timing and
                does run in CI.
          - demo: kiosk-demo-philslist
            # NON-COMMERCE classifieds board — no payments. demo:walkthrough is
            # the browse→post→edit→close happy path; demo:schema asserts `pay` is
            # ABSENT from the advertised capabilities (the not-only-commerce
            # proof). Same standard task set as stylish.
            # demo:register is the registration-PoW gate — no proof → 402, ONE
            # Equihash solve at the CI-default `low` → 201, then the fresh token
            # posts a listing and a bad category_slug gets a clean 400 naming the
            # valid categories. Same profile as atablefor's demo:backoff, ~4 s.
            # It reseeds (`: :setup`), so it goes after demo:walkthrough, which
            # has no prerequisite and lives off the job-level demo:setup.
            # Watched fail: set registration_pow_count to 0 and the unproven
            # register returns 201 instead of 402.
            tasks: demo:walkthrough demo:isolation demo:redteam demo:schema demo:register
            ungated:
              demo:binding: >-
                timing-sensitive: the account-binding ceremony polls on the
                advertised RFC 8628 device-grant interval, which flakes on a
                shared runner — the same exclusion as stylish's.
          - demo: kiosk-demo-tudu
            # NON-COMMERCE collaborative todo — no payments. demo:collab is the
            # happy path (membership-based sharing + agent→agent invites +
            # per-agent attribution); demo:schema asserts `pay` ABSENT like
            # philslist.
            tasks: demo:collab demo:isolation demo:redteam demo:schema
            ungated:
              demo:link: >-
                the W5 rebind/assistant_claimed ceremony — timing-sensitive on
                the RFC 8628 device-grant poll interval, the same exclusion as
                the sibling demo:binding tasks.
          # Every demo: task a demo defines must appear either in its `tasks:`
          # list above (or be demo:setup, which the "Set up demo" step runs) or
          # in its `ungated:` map with the reason it is not a gate. That is not a
          # convention anyone has to remember: bin/check-ci-tasks enforces it in
          # the ci-task-coverage job below, and generates the "Which of these run
          # in CI" table in each demo's README from these very lists (K-619).

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Demos register with a real Equihash PoW (numpy-vectorised solve.py),
      # so the solver needs numpy in CI.
      - name: Set up Python (Equihash solver)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        run: python -m pip install numpy

      - name: Install dependencies
        working-directory: ${{ matrix.demo }}
        run: bundle install

      # Parser guard for the K-619 coverage check. bin/check-ci-tasks derives
      # each demo's task inventory statically from lib/tasks/*.rake so it can run
      # on a bare checkout with no bundle; a static parser that goes blind to a
      # task shape would fail OPEN — precisely the failure mode the check exists
      # to prevent. Here the bundle is already installed, so re-derive the same
      # inventory from Rake's own table (`bin/rails -AT`) and assert the two
      # agree. ~0.3 s, no database.
      - name: Task inventory matches Rake (bin/check-ci-tasks parser guard)
        run: ./bin/check-ci-tasks --verify-inventory ${{ matrix.demo }}

      # skooti's demo:kyc / demo:redteam and getgrocery's demo:agecheck are
      # two-server integrations that boot the KYC broker (kiosk-demo-prove)
      # on its own port; that sibling app needs its own bundle installed for the
      # boot helper to `rails s` it.
      - name: Install KYC broker deps (two-server KYC gates)
        if: matrix.prove_broker
        working-directory: ${{ matrix.prove_broker }}
        run: bundle install

      # Demos self-provision a dev signing key when none is set;
      # this ephemeral key is belt-and-braces only.
      - name: Generate ephemeral signing key
        run: echo "KIOSK_SIGNING_KEY_B64=$(ruby -e 'require %{openssl}; require %{base64}; puts Base64.strict_encode64(OpenSSL::PKey::RSA.new(2048).to_pem)')" >> "$GITHUB_ENV"

      # prove only: the broker's production.rb refuses to boot without its RSA
      # signing key (PROVE_KEY_PEM, K-673) and validates that it parses as a
      # private key, so the zeitwerk:check step below needs a real throwaway
      # keypair — a literal string will not do. Multi-line value, hence the
      # GITHUB_ENV heredoc form.
      - name: Generate ephemeral broker signing key (prove, K-673)
        if: matrix.demo == 'kiosk-demo-prove'
        run: |
          {
            echo "PROVE_KEY_PEM<<PEM_EOF"
            ruby -e 'require "openssl"; puts OpenSSL::PKey::RSA.new(2048).to_pem'
            echo "PEM_EOF"
          } >> "$GITHUB_ENV"

      # skooti only: its production.rb refuses to boot without the Ed25519
      # rental-token signing key (KIOSK_UNLOCK_SIGNING_KEY_PEM, K-686) and
      # validates that it parses as an Ed25519 PRIVATE key, so the
      # zeitwerk:check step below needs a real throwaway keypair — a literal
      # string will not do. Generated per run rather than pinned in this file:
      # K-686 is precisely a key that was published by being written down.
      # Multi-line value, hence the GITHUB_ENV heredoc form.
      - name: Generate ephemeral unlock signing key (skooti, K-686)
        if: matrix.demo == 'kiosk-demo-skooti'
        run: |
          {
            echo "KIOSK_UNLOCK_SIGNING_KEY_PEM<<PEM_EOF"
            ruby -e 'require "openssl"; puts OpenSSL::PKey.generate_key("ED25519").private_to_pem'
            echo "PEM_EOF"
          } >> "$GITHUB_ENV"

      # getgrocery only: install stripe-mock on PATH and advertise its URL so
      # the real-Stripe-adapter demo runs against canned pi_ fixtures with NO
      # key. demo:setup/demo:schema boot on STRIPE_MOCK_URL; the
      # charge-running tasks self-start the mock process via `command -v`.
      - name: Set up stripe-mock (getgrocery, no key in CI)
        if: matrix.stripe_mock
        run: |
          go install github.com/stripe/stripe-mock@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "STRIPE_MOCK_URL=http://127.0.0.1:12111" >> "$GITHUB_ENV"

      # Production eager-load / Zeitwerk guard — EVERY demo, EVERY push (K-513).
      #
      # K-488: a copied lib/ helper (top-level methods, no matching constant)
      # landed in three demos without the corresponding
      # `config.autoload_lib(ignore:)` entry. Every gate stayed green — demo
      # suites and flows run in development/test, where `config.eager_load` is
      # false and Zeitwerk resolves lazily — and the bug only surfaced as a
      # production boot crash that 502'd three hosted demos.
      # `zeitwerk:check` eager-loads the whole app in RAILS_ENV=production and
      # exits non-zero on the first constant/path mismatch, so it catches that
      # class in seconds. The response to K-488 was a process rule ("run this on
      # every changed demo before deploy") that lived only in a ledger row; this
      # step is that rule, enforced.
      #
      # It needs NO database — it eager-loads code, it does not connect — so it
      # runs BEFORE the Postgres client install and demo:setup and fails fast.
      # It does need the two things the production env refuses to invent:
      #   SECRET_KEY_BASE — Rails raises "Missing `secret_key_base` for
      #     'production'" during boot; a throwaway literal is enough (nothing is
      #     signed or served here).
      #   STRIPE_MOCK_URL — getgrocery's initializer aborts production boot
      #     without a Stripe key or mock URL; the stripe-mock step above already
      #     exported it for that demo (hence this step's position after it).
      #   KIOSK_POW_SECRET — K-541 made the PoW HMAC key mandatory in
      #     production, so without it every kiosk demo aborts before Zeitwerk
      #     runs (since K-650 the fetch-with-raise lives in
      #     config/environments/production.rb rather than the initializer —
      #     same abort, one file earlier). A throwaway literal is enough (no
      #     challenge is signed here).
      #   KIOSK_ISSUER — K-510 made the issuer crash-if-absent in production
      #     for the same reason, and it aborts at the same point (also moved
      #     to production.rb by K-650). The K-541 fix above added only the PoW
      #     secret, so all seven operator demos still aborted. Any
      #     syntactically valid absolute origin does; nothing is signed or
      #     dialed here.
      #   PROVE_KEY_PEM — K-673 made the broker's signing key crash-if-absent
      #     in prove's production.rb (prove only; the operator demos ignore
      #     it). It must PARSE as an RSA private key, so the generate step
      #     above exports a throwaway keypair instead of a literal here.
      #   KIOSK_UNLOCK_SIGNING_KEY_PEM — K-686 made the Ed25519 rental-token
      #     signing key crash-if-absent in production for the demos that issue
      #     unlock tokens, which is skooti alone (the shared production.rb
      #     keys the requirement off the demo shipping a
      #     config/dev_unlock_key.pem, not off its name, so the other six are
      #     unaffected). It must PARSE as an Ed25519 private key, so the
      #     skooti-only generate step above exports a throwaway keypair.
      # The signing key exported above is likewise already in the environment.
      #
      # A missing one of these does NOT silently pass: `bin/rails zeitwerk:check`
      # exits 1 on the initializer's raise and this step has no
      # continue-on-error, so the job goes RED. The failure mode is not a blind
      # gate, it is a gate that reddens for a reason unrelated to eager loading
      # — which reads as "the demo is broken" and costs a maintainer the time to
      # discover it was only a missing env var. (Both omissions above went
      # unnoticed only because this workflow had not run since 2026-08-09.)
      #
      # RULE OF THUMB for the next crash-if-absent config: if a demo's
      # config/environments/production.rb (the K-650 home of such raises)
      # learns to require a new variable, add it HERE in the same commit — AND
      # in deploy/CHECKLIST.md §5, which documents this exact command for a
      # human to type before a deploy. That second half was missed when
      # KIOSK_ISSUER was added here, so the documented command aborted (exit 1,
      # "KIOSK_ISSUER is required outside development/test") on all seven
      # operator demos. The two copies are one gate written twice.
      - name: Production eager-load check (zeitwerk:check, K-488/K-513)
        working-directory: ${{ matrix.demo }}
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: ci-zeitwerk-check-throwaway-secret-key-base
          KIOSK_POW_SECRET: ci-zeitwerk-check-throwaway-pow-secret-not-a-real-key
          KIOSK_ISSUER: https://ci-zeitwerk-check.example.test
        run: bin/rails zeitwerk:check

      # The committed db/structure.sql files are PG17-format (they SET
      # transaction_timeout, a v17 param); loading them needs a psql >= 17, and
      # dumping after migrate needs a pg_dump matching the postgres:17 service.
      # Runner images ship an older client inconsistently, so pin 17.
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Set up demo
        working-directory: ${{ matrix.demo }}
        run: bin/rails demo:setup

      # Each demo task runs in its OWN bin/rails invocation. Demo servers are
      # cleaned up at_exit (process end), so batching every task into one
      # invocation leaves a later task probing a stale server booted with a
      # different env (order-dependent flake).
      - name: Run demo flows
        working-directory: ${{ matrix.demo }}
        run: |
          for task in ${{ matrix.tasks }}; do
            echo "::group::$task"
            bin/rails "$task"
            echo "::endgroup::"
          done

  # Does CI actually run the tasks the demos define? (K-619)
  #
  # Five ledger rows (K-602/K-614/K-616/K-617/K-618) were spent re-deriving BY
  # HAND, one rake file at a time, which assertion-bearing `demo:` tasks no gate
  # invoked — a list no artifact published. The workflow's own comments were the
  # sole record and had already drifted (they asserted "demo:rls moved to
  # getgrocery" for the whole period before the move happened). This job is the
  # replacement for remembering: bin/check-ci-tasks reads the demos matrix above
  # and every demo's lib/tasks/*.rake, and fails when a task is in neither the
  # `tasks:` list nor the entry's `ungated:` map with a reason — and when the
  # "Which of these run in CI" table it generates in each demo README is stale.
  # Stdlib Ruby only: no bundle, no services, no database, ~0.1 s.
  ci-task-coverage:
    name: CI task coverage (bin/check-ci-tasks)
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Every demo task is either gated or opted out with a reason
        run: ./bin/check-ci-tasks

  # The demos are eight standalone Rails apps, so shared application code is not
  # shared — it is HAND-COPIED, and until now nothing checked the copies still
  # agreed. lib/demo_telemetry.rb carried a stale comment in six of its seven
  # copies until a fix propagated it by accident (K-623); the solver-path
  # constant in lib/equihash_register.rb was renamed in three of its five copies
  # and nobody noticed for three weeks. bin/check-demo-copies makes both of those
  # a red build: every relative path present in two or more demos must be
  # declared identical, identical-modulo-prose, or a deliberate per-demo variant
  # with the reason — and an UNDECLARED duplicate fails too, so a new copy cannot
  # appear silently, which is how six of them got here.
  #
  # It is a separate job rather than a step in ci-task-coverage so the two
  # invariants (is every task gated / do the copies agree) fail with their own
  # names. Stdlib Ruby only: no bundle, no services, no database, ~0.2 s.
  demo-file-sync:
    name: duplicated demo files agree (bin/check-demo-copies)
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Hand-copied demo files agree, or the divergence is declared
        run: ./bin/check-demo-copies

  # What a `gem install` gets is NOT what this repo contains, and until now
  # nothing checked the difference. kiosk-server's spec.files globbed lib/ only,
  # so the three ERB templates under app/views/kiosk/server/ were absent from
  # the built gem while two controllers append_view_path at exactly that
  # directory: anyone installing kiosk-server from RubyGems got
  # ActionView::MissingTemplate on BOTH HTML pages of the account-binding
  # ceremony. Every job above stayed green throughout, and could not have done
  # otherwise — every consumer in this monorepo (the demos, the e2e fixture, the
  # sibling gems) uses `path:`, which serves the working tree, so no suite here
  # can tell "the file exists" from "the file is packaged". CI had no observer
  # who installs a gem. This job is that observer: it builds all 14 gems and
  # fails when a tracked file is neither packaged nor declared scaffolding, or
  # when packaged Ruby resolves a __dir__-relative path to something the package
  # does not contain.
  #
  # Its own job, alongside ci-task-coverage and demo-file-sync, for the same
  # reason those two are separate: one invariant, one exit code, one name in the
  # checks list. Stdlib Ruby only: no bundle, no services, no database, ~2 s.
  gem-packaging:
    name: gems package what they need (bin/check-gem-packaging)
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Every gem ships the files its own code reaches for
        run: ./bin/check-gem-packaging

  # protocol.md §14.1 is normative and says the protocol, this implementation
  # and the AI assistant skill share their MAJOR.MINOR version. It was false
  # about the implementation on every request for months (K-748): the protocol
  # was 0.3.0 and the skill 0.3.11 while thirteen gems were 0.0.1 and
  # kiosk-pow-equihash 0.1.0 — and kiosk-server emits the gem version, so one
  # response carried `Kiosk-API-Version: 0.3.0` next to
  # `Kiosk-Server-Version: 0.0.1`. Nothing was red, and nothing could be: the
  # version is an input to no assertion in this repo, the specs that touch it
  # match /\A\d+\.\d+\.\d+\z/ or compare the constant against itself. Phil's
  # answer was to honour the rule and stop it being prose, so this job is the
  # rule: every gemspec's version, every `~> ` constraint between our own gems,
  # and every pinned skill_url must share MAJOR.MINOR with
  # Kiosk::Protocol::API_VERSION. PATCH is deliberately NOT compared — a
  # per-gem patch release is legitimate and §14.1 binds MAJOR.MINOR only.
  #
  # Its own job, alongside the three checks above, for the same reason they are
  # separate: one invariant, one exit code, one name in the checks list. Stdlib
  # Ruby only: no bundle, no services, no database, no network, ~0.1 s.
  version-parity:
    name: version parity (bin/check-version-parity)
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Gems, constraints and the skill pin share the protocol's MAJOR.MINOR
        run: ./bin/check-version-parity

  # Production-boot smoke — the guard for the prod-only bug class that the
  # dev-mode gems/demos/e2e jobs are all blind to. Three shipped bugs (K-422
  # eager-load Zeitwerk crash, K-436 missing governance columns → manage-page
  # 500, K-439 assume_ssl off → CSRF-Origin silent sign-in failure) ALL reached
  # the hosted demos and none tripped CI, because CI boots the server in
  # RAILS_ENV=development (lazy autoload, no proxy, no Origin check). This boots
  # ONE demo per UNIQUE human-facing HTML surface exactly like the deploy:
  # RAILS_ENV=production (config.eager_load=true, config.assume_ssl=true) behind
  # a simulated proxy+browser, and curl-asserts the surfaces those bugs broke:
  #   stylish — Devise sign-in, roles, the manage page (the original three-bug
  #             surface).
  #   prove   — the KYC broker's /verify human page (K-462): a distinct
  #             token-capability HTML surface with a form POST and no login,
  #             depending on no kiosk gem. The stylish-only smoke never covered
  #             it. Booting all seven demos in prod would be heavier CI for
  #             little marginal signal (the prod-only classes are per-surface).
  # See deploy/production-smoke.sh; any assertion miss fails the job.
  demo-production-smoke:
    name: production-boot smoke (stylish + prove)
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # database.yml (production) connects as this role; the postgres service
      # runs trust auth as `postgres`, so no password is needed.
      KIOSK_STYLISH_DB_USER: postgres
      KIOSK_STYLISH_DB_PASSWORD: ""
      # Same for the KYC broker's production database.yml.
      KIOSK_PROVE_DB_USER: postgres
      KIOSK_PROVE_DB_PASSWORD: ""
      # The smoke DROPS and rebuilds its database (a throwaway `kiosk_<app>_smoke`
      # that no deployment provisions), so it refuses to run unless the caller
      # states the target is disposable — see the safety header in
      # deploy/production-smoke.sh (K-594). GitHub already sets CI=true, which
      # the script also accepts; stating it here keeps the workflow explicit and
      # independent of that ambient variable. Never set this on a deploy host —
      # there the script refuses regardless, and this variable does not override
      # that.
      KIOSK_SMOKE_I_AM_DISPOSABLE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install stylish dependencies
        working-directory: kiosk-demo-stylish
        run: bundle install

      - name: Install KYC broker dependencies
        working-directory: kiosk-demo-prove
        run: bundle install

      # structure.sql is PG17-format (SET transaction_timeout, a v17 param), so
      # db:schema:load needs a psql >= 17 — same reason the demos/e2e jobs pin it.
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      # Boot stylish in production and run the four proxy+browser assertions.
      # The script self-provides SECRET_KEY_BASE + KIOSK_SIGNING_KEY_B64 + the
      # K-541 KIOSK_POW_SECRET (the production initializer self-provisions none
      # of them and refuses to boot without them) on a fixed, collision-free port.
      - name: Production-boot smoke (stylish)
        run: ./deploy/production-smoke.sh stylish

      # Boot the KYC broker in production and assert its /verify HTML page
      # (live form + clean not-recognised + form POST behind the proxy) renders
      # rather than 500 — the K-462 gap the stylish-only smoke did not cover.
      - name: Production-boot smoke (KYC broker)
        run: ./deploy/production-smoke.sh prove

  # Live solver-pin probe (K-528). The Equihash solver exists in four copies
  # that must never diverge — kiosk-pow-equihash/solve.py (source of truth),
  # kiosk.tech/pow/solve.py (hosted), the sha256 the skill pins, and the URL in
  # PowGate::POW_INVALID_HINT — because the skill instructs assistants to verify
  # the hash and REFUSE to execute a mismatch. A drift does not error anywhere:
  # registrations just stop working.
  #
  # The OFFLINE half of the guard (this repo's solve.py vs the pin, and the 403
  # hint URL) needs no network and is already blocking on every push — it runs
  # inside the kiosk-pow-equihash suite in the gems matrix above
  # (spec/solver_pin_spec.rb), which is also the merge gate for a solve.py edit.
  #
  # This job is the half that needs the network: it fetches what kiosk.tech
  # actually serves. Deliberately NOT run on push/pull_request:
  #   - it would gate every merge in this repo on a third-party HTTP fetch, and
  #     a kiosk.tech outage blocking an unrelated Ruby change is a bad trade;
  #   - it would also be pointless there — the drift is introduced by commits in
  #     the kiosk.tech repo, which never trigger this workflow.
  # Instead it runs daily (and on demand), and it FAILS HARD when it fails:
  # a scheduled workflow that goes red on the default branch notifies, whereas
  # continue-on-error would render the whole point of the guard invisible.
  # Transient blips are absorbed by the script's 3 attempts with backoff.
  solver-pin-live:
    name: solver pin (live kiosk.tech)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Stdlib only (digest + net/http) — no bundle, no services.
      - name: Check the served solver against the pin
        run: ./bin/check-solver-pin --network

  e2e:
    name: kiosk OSS end-to-end
    runs-on: ubuntu-latest
    # The daily schedule exists for solver-pin-live; don't rebuild the world.
    if: github.event_name != 'schedule'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install Rails
        run: gem install rails --no-document

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The e2e golden path registers with a real register-time Equihash PoW,
      # solved by the bundled numpy-vectorised solver (solve.py); the harness
      # needs numpy or it errors "this solver requires numpy".
      - name: Set up Python (Equihash solver)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        run: python -m pip install numpy

      - name: Install PostgreSQL 17 client (PG17-format structure.sql / postgres:17 service)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Run e2e
        run: ./e2e/run.sh
