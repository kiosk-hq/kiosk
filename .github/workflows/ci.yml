name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gems:
    name: ${{ matrix.gem }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        gem:
          - kiosk-all
          - kiosk-core
          - kiosk-pay-stripe
          - kiosk-pow
          - kiosk-pow-cuckoo
          - kiosk-pow-equihash
          - kiosk-redteam
          - kiosk-reputation
          - kiosk-rls
          - kiosk-rls-rspec
          - kiosk-server
          - kiosk-test-support
          - kiosk-user-idp-devise
        cmd: ["bundle exec rspec"]
        include:
          - gem: kiosk-rls-minitest
            cmd: bundle exec rake test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Two gem jobs need the bundled numpy-vectorised solver (solve.py):
      # kiosk-redteam's client solves a real Equihash PoW, and
      # kiosk-pow-equihash's :parity specs live-solve the shipped 168/7 params
      # to prove the solver and Ruby verifier agree end-to-end (T-013). Without
      # numpy solve.py errors "this solver requires numpy" (redteam) or the
      # :parity roundtrips silently skip (pow-equihash), so install it for both.
      - name: Set up Python (Equihash solver)
        if: matrix.gem == 'kiosk-redteam' || matrix.gem == 'kiosk-pow-equihash'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        if: matrix.gem == 'kiosk-redteam' || matrix.gem == 'kiosk-pow-equihash'
        run: python -m pip install numpy

      - name: Install dependencies
        working-directory: ${{ matrix.gem }}
        run: bundle install

      - name: Run suite
        working-directory: ${{ matrix.gem }}
        run: ${{ matrix.cmd }}

  demos:
    name: ${{ matrix.demo }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: kiosk-demo-atablefor
            # Restaurant table-booking: NO
            # payments — demo:book is the headline ("book a table for 2"),
            # demo:schema asserts pay ABSENT (capabilities [schema,query,run]).
            # demo:binding is the human-IdP + account-linking beat (a diner links
            # their assistant via the real Devise session, and the assistant's
            # booking ties to the diner's account); unlike the sibling binding
            # demos it carries no RFC 8628 poll timing, so it runs in CI.
            # demo:pow/demo:reputation (the heavy anti-scalping toll) run locally,
            # not in CI (demo:pow is excluded everywhere). demo:backoff, however,
            # is PoW-only (no RFC 8628 timing) and solves exactly ONE small
            # Equihash proof at the CI-default `low` difficulty (n=96 k=5,
            # sub-second) before asserting the count-based grant, so it runs in
            # CI. demo:rls moved to getgrocery.
            tasks: demo:backoff demo:book demo:binding demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-getgrocery
            tasks: demo:shop demo:isolation demo:redteam demo:schema
            # getgrocery uses the real Stripe adapter. CI carries NO Stripe key
            # (never inject keys into CI); a local stripe-mock returns
            # shaped pi_ fixtures so the full flow — including demo:shop's
            # off_session charge — runs secret-free. STRIPE_MOCK_URL (set by the
            # stripe-mock step below) makes demo:setup/demo:schema boot, and
            # demo:shop/isolation/redteam self-start the mock process.
            stripe_mock: true
          - demo: kiosk-demo-hoteling
            tasks: demo:book demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-skooti
            # demo:kyc = the KYC attribute gate (combustion motorcycle needs
            # age_over_18 + licence_a; the electric scooter is licence-free).
            tasks: demo:kat demo:rideflow demo:kyc demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-stylish
            tasks: demo:walkthrough demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-philslist
            # NON-COMMERCE classifieds board — no payments. demo:walkthrough is
            # the browse→post→edit→close happy path; demo:schema asserts `pay` is
            # ABSENT from the advertised capabilities (the not-only-commerce
            # proof). Same standard task set as stylish; demo:binding is
            # timing-sensitive (RFC 8628 poll interval) so it stays local-only,
            # matching every sibling (no demo runs binding in CI).
            tasks: demo:walkthrough demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-tudu
            # NON-COMMERCE collaborative todo — no payments. demo:collab is the
            # happy path (membership-based sharing + agent→agent invites +
            # per-agent attribution); demo:schema asserts `pay` ABSENT like
            # philslist. demo:link (the W5 rebind/assistant_claimed ceremony) is
            # timing-sensitive (RFC 8628 poll) so it stays local-only, matching
            # every sibling (no demo runs binding in CI).
            tasks: demo:collab demo:isolation demo:redteam demo:schema
          # demo:pow excluded everywhere: solves real memory-hard PoW

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      # Demos register with a real Equihash PoW (numpy-vectorised solve.py),
      # so the solver needs numpy in CI.
      - name: Set up Python (Equihash solver)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        run: python -m pip install numpy

      - name: Install dependencies
        working-directory: ${{ matrix.demo }}
        run: bundle install

      # Demos self-provision a dev signing key when none is set;
      # this ephemeral key is belt-and-braces only.
      - name: Generate ephemeral signing key
        run: echo "KIOSK_SIGNING_KEY_B64=$(ruby -e 'require %{openssl}; require %{base64}; puts Base64.strict_encode64(OpenSSL::PKey::RSA.new(2048).to_pem)')" >> "$GITHUB_ENV"

      # getgrocery only: install stripe-mock on PATH and advertise its URL so
      # the real-Stripe-adapter demo runs against canned pi_ fixtures with NO
      # key. demo:setup/demo:schema boot on STRIPE_MOCK_URL; the
      # charge-running tasks self-start the mock process via `command -v`.
      - name: Set up stripe-mock (getgrocery, no key in CI)
        if: matrix.stripe_mock
        run: |
          go install github.com/stripe/stripe-mock@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "STRIPE_MOCK_URL=http://127.0.0.1:12111" >> "$GITHUB_ENV"

      # The committed db/structure.sql files are PG17-format (they SET
      # transaction_timeout, a v17 param); loading them needs a psql >= 17, and
      # dumping after migrate needs a pg_dump matching the postgres:17 service.
      # Runner images ship an older client inconsistently, so pin 17.
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Set up demo
        working-directory: ${{ matrix.demo }}
        run: bin/rails demo:setup

      # Each demo task runs in its OWN bin/rails invocation. Demo servers are
      # cleaned up at_exit (process end), so batching every task into one
      # invocation leaves a later task probing a stale server booted with a
      # different env (order-dependent flake).
      - name: Run demo flows
        working-directory: ${{ matrix.demo }}
        run: |
          for task in ${{ matrix.tasks }}; do
            echo "::group::$task"
            bin/rails "$task"
            echo "::endgroup::"
          done

  e2e:
    name: kiosk OSS end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install Rails
        run: gem install rails --no-document

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The e2e golden path registers with a real register-time Equihash PoW,
      # solved by the bundled numpy-vectorised solver (solve.py); the harness
      # needs numpy or it errors "this solver requires numpy".
      - name: Set up Python (Equihash solver)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy (Equihash solver)
        run: python -m pip install numpy

      - name: Install PostgreSQL 17 client (PG17-format structure.sql / postgres:17 service)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Run e2e
        run: ./e2e/run.sh
