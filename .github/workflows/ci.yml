name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gems:
    name: ${{ matrix.gem }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        gem:
          - kiosk-all
          - kiosk-core
          - kiosk-pay-stripe
          - kiosk-pow
          - kiosk-pow-cuckoo
          - kiosk-pow-equihash
          - kiosk-redteam
          - kiosk-reputation
          - kiosk-rls
          - kiosk-rls-rspec
          - kiosk-server
          - kiosk-test-support
          - kiosk-user-idp-devise
        cmd: ["bundle exec rspec"]
        include:
          - gem: kiosk-rls-minitest
            cmd: bundle exec rake test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install dependencies
        working-directory: ${{ matrix.gem }}
        run: bundle install

      - name: Run suite
        working-directory: ${{ matrix.gem }}
        run: ${{ matrix.cmd }}

  demos:
    name: ${{ matrix.demo }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: kiosk-demo-foodelivery
            # demo:order is the pay-settling headline (order_flow.rb + QA1-3 +
            # settlements assertions), matching how each sibling row runs its
            # settling headline (shop/book/rideflow). It settles via StubPsp,
            # so no Stripe key / stripe-mock is needed. (demo:walkthrough is the
            # curl tour; it self-asserts but does not exercise the pay verb.)
            tasks: demo:order demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-getgrocery
            tasks: demo:shop demo:isolation demo:redteam demo:schema
            # getgrocery uses the real Stripe adapter. CI carries NO Stripe key
            # (K-110: never inject keys into CI); a local stripe-mock returns
            # shaped pi_ fixtures so the full flow — including demo:shop's
            # off_session charge — runs secret-free. STRIPE_MOCK_URL (set by the
            # stripe-mock step below) makes demo:setup/demo:schema boot, and
            # demo:shop/isolation/redteam self-start the mock process.
            stripe_mock: true
          - demo: kiosk-demo-hoteling
            tasks: demo:book demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-skooti
            tasks: demo:kat demo:rideflow demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-saas-booking
            tasks: demo:walkthrough demo:isolation demo:redteam demo:schema
          - demo: kiosk-demo-philslist
            # NON-COMMERCE classifieds board — no payments. demo:walkthrough is
            # the browse→post→edit→close happy path; demo:schema asserts `pay` is
            # ABSENT from the advertised capabilities (the not-only-commerce
            # proof). Same standard task set as saas-booking; demo:binding is
            # timing-sensitive (RFC 8628 poll interval) so it stays local-only,
            # matching every sibling (no demo runs binding in CI).
            tasks: demo:walkthrough demo:isolation demo:redteam demo:schema
          # demo:pow excluded everywhere: solves real memory-hard PoW (K-001)

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install dependencies
        working-directory: ${{ matrix.demo }}
        run: bundle install

      # Demos self-provision a dev signing key since e8bc5bf (K-034 fixed);
      # this ephemeral key is belt-and-braces only.
      - name: Generate ephemeral signing key
        run: echo "KIOSK_SIGNING_KEY_B64=$(ruby -e 'require %{openssl}; require %{base64}; puts Base64.strict_encode64(OpenSSL::PKey::RSA.new(2048).to_pem)')" >> "$GITHUB_ENV"

      # getgrocery only: install stripe-mock on PATH and advertise its URL so
      # the real-Stripe-adapter demo runs against canned pi_ fixtures with NO
      # key (K-110). demo:setup/demo:schema boot on STRIPE_MOCK_URL; the
      # charge-running tasks self-start the mock process via `command -v`.
      - name: Set up stripe-mock (getgrocery, no key in CI — K-110)
        if: matrix.stripe_mock
        run: |
          go install github.com/stripe/stripe-mock@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "STRIPE_MOCK_URL=http://127.0.0.1:12111" >> "$GITHUB_ENV"

      - name: Set up demo
        working-directory: ${{ matrix.demo }}
        run: bin/rails demo:setup

      # Each demo task runs in its OWN bin/rails invocation. Demo servers are
      # cleaned up at_exit (process end), so batching every task into one
      # invocation leaves a later task probing a stale server booted with a
      # different env (order-dependent flake, K-086).
      - name: Run demo flows
        working-directory: ${{ matrix.demo }}
        run: |
          for task in ${{ matrix.tasks }}; do
            echo "::group::$task"
            bin/rails "$task"
            echo "::endgroup::"
          done

  e2e:
    name: kiosk OSS end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.1"
          bundler-cache: false

      - name: Install Rails
        run: gem install rails --no-document

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run e2e
        run: ./e2e/run.sh
