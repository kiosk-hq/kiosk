plugins:
  - rubocop-minitest
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  TargetRailsVersion: 8.1
  Exclude:
    - "**/db/schema.rb"
    - "**/db/migrate/**/*"
    - "**/vendor/**/*"
    - "**/node_modules/**/*"
    - "**/tmp/**/*"
    - "**/log/**/*"
    - "kiosk-demo-*/bin/rails"
    - "kiosk-demo-*/bin/rake"
    - "kiosk-demo-*/bin/setup"
    - "kiosk-demo-*/bin/dev"
    - "kiosk-demo-skooti/firmware/**/*.c"

Layout/LineLength:
  Enabled: false

Style/Documentation:
  Enabled: false

# The default excludes name `spec/` and `test/` at the config root; here every
# project keeps them one level down.
Naming/PredicatePrefix:
  Exclude:
    - "**/spec/**/*"

Style/NumericPredicate:
  Exclude:
    - "**/spec/**/*"

Style/OneClassPerFile:
  Exclude:
    - "**/spec/**/*"
    - "**/test/**/*"

# The Rails cops read the code that runs inside a Rails app. Excluded: the
# plain Ruby gems, the scripts that run outside an app under bare `ruby`, and
# the app file the firmware crosscheck loads under bare `ruby`.
Rails:
  Exclude: &plain_ruby
    - "bin/**/*"
    - "deploy/**/*"
    - "spec/**/*"
    - "e2e/schema_conformance.rb"
    - "e2e/fixtures/auth_wire_capture.rb"
    - "e2e/fixtures/bind_assistants.rb"
    - "e2e/fixtures/claim_flow.rb"
    - "e2e/fixtures/equihash_register.rb"
    - "e2e/fixtures/pay_flow.rb"
    - "e2e/fixtures/register_pow_flow.rb"
    - "kiosk-demo-*/script/**/*"
    - "kiosk-demo-skooti/firmware/**/*"
    - "kiosk-demo-skooti/app/services/rental_token_issuer.rb"
    - "kiosk-core/**/*"
    - "kiosk-kyc-prove/**/*"
    - "kiosk-pow/**/*"
    - "kiosk-pow-argon2id/**/*"
    - "kiosk-pow-cuckoo/**/*"
    - "kiosk-pow-equihash/**/*"
    - "kiosk-redteam/**/*"
    - "kiosk-reputation/**/*"
    - "kiosk-rls/**/*"
    - "kiosk-rls-minitest/**/*"
    - "kiosk-rls-rspec/**/*"
    - "kiosk-test-support/**/*"

RSpecRails:
  Exclude: *plain_ruby

# A conformance matcher takes the name of the verb it checks as its subject.
RSpec/ExpectActual:
  Exclude:
    - "kiosk-demo-hoteling/spec/conformance/kiosk_conformance_spec.rb"
    - "kiosk-test-support/spec/kiosk/test_helpers/conformance/adapters_spec.rb"

# The RSpec cops below are being fixed one family at a time.
RSpec/AnyInstance:
  Enabled: false
RSpec/BeforeAfterAll:
  Enabled: false
RSpec/ContextWording:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/DescribeMethod:
  Enabled: false
RSpec/DescribedClass:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/ExpectInHook:
  Enabled: false
RSpec/IdenticalEqualityAssertion:
  Enabled: false
RSpec/IncludeExamples:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/LeakyLocalVariable:
  Enabled: false
RSpec/LetSetup:
  Enabled: false
RSpec/MessageSpies:
  Enabled: false
RSpec/MultipleDescribes:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/NestedGroups:
  Enabled: false
RSpec/Output:
  Enabled: false
RSpec/PredicateMatcher:
  Enabled: false
RSpec/ReceiveMessages:
  Enabled: false
RSpec/RemoveConst:
  Enabled: false
RSpec/RepeatedDescription:
  Enabled: false
RSpec/RepeatedExampleGroupDescription:
  Enabled: false
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/SpecFilePathSuffix:
  Enabled: false
RSpec/StubbedMock:
  Enabled: false
RSpec/VerifiedDoubleReference:
  Enabled: false
RSpec/VerifiedDoubles:
  Enabled: false
