plugins:
  - rubocop-minitest
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  TargetRailsVersion: 8.1
  Exclude:
    - "**/db/schema.rb"
    - "**/db/migrate/**/*"
    - "**/vendor/**/*"
    - "**/node_modules/**/*"
    - "**/tmp/**/*"
    - "**/log/**/*"
    - "kiosk-demo-*/bin/rails"
    - "kiosk-demo-*/bin/rake"
    - "kiosk-demo-*/bin/setup"
    - "kiosk-demo-*/bin/dev"
    - "kiosk-demo-skooti/firmware/**/*.c"

Layout/LineLength:
  Enabled: false

Style/Documentation:
  Enabled: false

# The default excludes name `spec/` and `test/` at the config root; here every
# project keeps them one level down.
Naming/PredicatePrefix:
  Exclude:
    - "**/spec/**/*"

Style/NumericPredicate:
  Exclude:
    - "**/spec/**/*"

Style/OneClassPerFile:
  Exclude:
    - "**/spec/**/*"
    - "**/test/**/*"

# The Rails cops read the code that runs inside a Rails app. Excluded: the
# plain Ruby gems, the scripts that run outside an app under bare `ruby`, and
# the app file the firmware crosscheck loads under bare `ruby`.
Rails:
  Exclude: &plain_ruby
    - "bin/**/*"
    - "deploy/**/*"
    - "spec/**/*"
    - "e2e/schema_conformance.rb"
    - "e2e/fixtures/auth_wire_capture.rb"
    - "e2e/fixtures/bind_assistants.rb"
    - "e2e/fixtures/claim_flow.rb"
    - "e2e/fixtures/equihash_register.rb"
    - "e2e/fixtures/pay_flow.rb"
    - "e2e/fixtures/register_pow_flow.rb"
    - "kiosk-demo-*/script/**/*"
    - "kiosk-demo-skooti/firmware/**/*"
    - "kiosk-demo-skooti/app/services/rental_token_issuer.rb"
    - "kiosk-core/**/*"
    - "kiosk-kyc-prove/**/*"
    - "kiosk-pow/**/*"
    - "kiosk-pow-argon2id/**/*"
    - "kiosk-pow-cuckoo/**/*"
    - "kiosk-pow-equihash/**/*"
    - "kiosk-redteam/**/*"
    - "kiosk-reputation/**/*"
    - "kiosk-rls/**/*"
    - "kiosk-rls-minitest/**/*"
    - "kiosk-rls-rspec/**/*"
    - "kiosk-test-support/**/*"

RSpecRails:
  Exclude: *plain_ruby

# The Minitest tests live in test/; the RSpec cops read the RSpec specs.
RSpec:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "**/test/**/*"

# A conformance matcher takes the name of the verb it checks as its subject.
RSpec/ExpectActual:
  Exclude:
    - "kiosk-demo-hoteling/spec/conformance/kiosk_conformance_spec.rb"
    - "kiosk-test-support/spec/kiosk/test_helpers/conformance/adapters_spec.rb"

# A probe app runs as a child process without RSpec: it reports to its spec on
# stdout and changes constants of a process that exits after it.
RSpec/Output:
  Exclude: &probe_apps
    - "kiosk-server/spec/support/*_app.rb"

RSpec/RemoveConst:
  Exclude: *probe_apps

# A spec at the root of a spec directory checks the repository's files, a
# conformance spec checks a whole origin, and a hoteling story follows a guest;
# none describes a class.
RSpec/DescribeClass:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "*/spec/*_spec.rb"
    - "kiosk-demo-hoteling/spec/conformance/*_spec.rb"
  IgnoredMetadata:
    type: [channel, controller, helper, job, mailer, model, request, routing, view, feature, system, mailbox, aruba, task, story]

# A generator spec follows the generator's lib/generators path, as in Rails.
RSpec/SpecFilePathFormat:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "**/spec/generators/**/*"
  CustomTransform:
    RuboCop: rubocop
    RSpec: rspec
    RLSRSpec: rls_rspec

# An example may check one behaviour with several expectations.
RSpec/MultipleExpectations:
  Enabled: false

# The RSpec cops below are being fixed one family at a time.
RSpec/ExampleLength:
  Enabled: false
