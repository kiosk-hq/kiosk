plugins:
  - rubocop-minitest
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  TargetRailsVersion: 8.1
  Exclude:
    - "**/db/schema.rb"
    - "**/db/migrate/**/*"
    - "**/vendor/**/*"
    - "**/node_modules/**/*"
    - "**/tmp/**/*"
    - "**/log/**/*"
    - "kiosk-demo-*/bin/rails"
    - "kiosk-demo-*/bin/rake"
    - "kiosk-demo-*/bin/setup"
    - "kiosk-demo-*/bin/dev"
    - "kiosk-demo-skooti/firmware/**/*.c"

Layout/LineLength:
  Enabled: false

Style/Documentation:
  Enabled: false

# The default excludes name `spec/` and `test/` at the config root; here every
# project keeps them one level down.
Naming/PredicatePrefix:
  Exclude:
    - "**/spec/**/*"

Style/NumericPredicate:
  Exclude:
    - "**/spec/**/*"

Style/OneClassPerFile:
  Exclude:
    - "**/spec/**/*"
    - "**/test/**/*"

# The Rails cops read the code that runs inside a Rails app. Excluded: the
# plain Ruby gems, the scripts that run outside an app under bare `ruby`, and
# the app file the firmware crosscheck loads under bare `ruby`.
Rails:
  Exclude: &plain_ruby
    - "bin/**/*"
    - "deploy/**/*"
    - "spec/**/*"
    - "e2e/schema_conformance.rb"
    - "e2e/fixtures/auth_wire_capture.rb"
    - "e2e/fixtures/bind_assistants.rb"
    - "e2e/fixtures/claim_flow.rb"
    - "e2e/fixtures/equihash_register.rb"
    - "e2e/fixtures/pay_flow.rb"
    - "e2e/fixtures/register_pow_flow.rb"
    - "kiosk-demo-*/script/**/*"
    - "kiosk-demo-skooti/firmware/**/*"
    - "kiosk-demo-skooti/app/services/rental_token_issuer.rb"
    - "kiosk-core/**/*"
    - "kiosk-kyc-prove/**/*"
    - "kiosk-pow/**/*"
    - "kiosk-pow-cuckoo/**/*"
    - "kiosk-pow-equihash/**/*"
    - "kiosk-redteam/**/*"
    - "kiosk-reputation/**/*"
    - "kiosk-rls/**/*"
    - "kiosk-rls-minitest/**/*"
    - "kiosk-rls-rspec/**/*"
    - "kiosk-test-support/**/*"

RSpecRails:
  Exclude: *plain_ruby

# rubocop-rspec_rails runs on the code of rubocop-rspec, so the plugin list
# loads both; the RSpec cops of rubocop-rspec are not part of this setup.
RSpec:
  Enabled: false
