default: &default
  adapter: postgresql
  encoding: unicode
  # Puma's threads, plus the job queue's worker, dispatcher and scheduler (config/queue.yml).
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>

development:
  <<: *default
  database: kiosk_atablefor_development

test:
  <<: *default
  database: kiosk_atablefor_test

production:
  <<: *default
  database: <%= ENV.fetch("KIOSK_ATABLEFOR_DB", "kiosk_atablefor_production") %>
  username: <%= ENV.fetch("KIOSK_ATABLEFOR_DB_USER", "kiosk_atablefor") %>
  password: <%= ENV["KIOSK_ATABLEFOR_DB_PASSWORD"] %>
