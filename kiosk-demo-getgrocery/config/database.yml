default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>

development:
  <<: *default
  # KIOSK_GETGROCERY_DB names this app's database in whichever env is running;
  # each env defaults to its own. Development honors it because the demo:* rake
  # tasks shell out to psql against the same name (lib/tasks/demo.rake).
  database: <%= ENV.fetch("KIOSK_GETGROCERY_DB", "kiosk_getgrocery_development") %>

test:
  <<: *default
  database: kiosk_getgrocery_test

production:
  <<: *default
  database: <%= ENV.fetch("KIOSK_GETGROCERY_DB", "kiosk_getgrocery_production") %>
  username: <%= ENV.fetch("KIOSK_GETGROCERY_DB_USER", "kiosk_getgrocery") %>
  password: <%= ENV["KIOSK_GETGROCERY_DB_PASSWORD"] %>
