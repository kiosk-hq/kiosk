default: &default
  adapter: postgresql
  encoding: unicode
  # Puma's threads, plus the job queue's worker, dispatcher and scheduler (config/queue.yml).
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>

development:
  <<: *default
  database: kiosk_hoteling_development

test:
  <<: *default
  database: kiosk_hoteling_test

production:
  <<: *default
  database: <%= ENV.fetch("KIOSK_HOTELING_DB", "kiosk_hoteling_production") %>
  username: <%= ENV.fetch("KIOSK_HOTELING_DB_USER", "kiosk_hoteling") %>
  password: <%= ENV["KIOSK_HOTELING_DB_PASSWORD"] %>
