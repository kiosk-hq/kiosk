# Validation messages name an attribute as the wire spells it.
en:
  activemodel:
    attributes:
      room_search:
        check_in: check_in
        check_out: check_out
  activerecord:
    attributes:
      booking:
        check_in: check_in
        check_out: check_out
        room_type: room_type_id
    errors:
      models:
        booking:
          attributes:
            room_type:
              required: "is not a room type here — call availability for the free ones"
