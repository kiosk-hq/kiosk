<!DOCTYPE html>
<!--
  Static 500 page (K-532). Rails' PublicExceptions serves this file for every
  unhandled exception in production; WITHOUT it the response is BODYLESS
  (text/html, Content-Length: 0) and a server fault is indistinguishable from an
  empty answer. Static: no interpolation, relative links only.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 — something went wrong</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 3rem 1.5rem; font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 42rem; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 1rem; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.95em; }
      .note { border-left: 3px solid currentColor; padding-left: 1rem; opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <h1>500 — something went wrong here</h1>
      <p>
        This broker failed to handle the request. Try the verification link
        again in a moment.
      </p>
      <p class="note">
        No decision is recorded unless the confirmation page says so, and no
        identity data leaves the broker without one.
      </p>
      <p><a href="/">Back to the home page</a></p>
    </main>
  </body>
</html>
