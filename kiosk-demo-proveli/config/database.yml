default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>

development:
  <<: *default
  database: kiosk_proveli_development

test:
  <<: *default
  database: kiosk_proveli_test

production:
  <<: *default
  database: <%= ENV.fetch("KIOSK_PROVELI_DB", "kiosk_proveli_production") %>
  username: <%= ENV.fetch("KIOSK_PROVELI_DB_USER", "kiosk_proveli") %>
  password: <%= ENV["KIOSK_PROVELI_DB_PASSWORD"] %>
