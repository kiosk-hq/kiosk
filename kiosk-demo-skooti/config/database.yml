default: &default
  adapter: postgresql
  encoding: unicode
  # Puma's threads, plus the job queue's worker, dispatcher and scheduler (config/queue.yml).
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>

development:
  <<: *default
  database: kiosk_skooti_development

test:
  <<: *default
  database: kiosk_skooti_test

production:
  <<: *default
  database: <%= ENV.fetch("KIOSK_SKOOTI_DB", "kiosk_skooti_production") %>
  username: <%= ENV.fetch("KIOSK_SKOOTI_DB_USER", "kiosk_skooti") %>
  password: <%= ENV["KIOSK_SKOOTI_DB_PASSWORD"] %>
