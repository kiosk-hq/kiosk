# Containerised kiosk-demo-tudu: `docker compose up` in this directory, and nothing else.
#
# It brings up a Postgres that belongs to THIS compose project, sets the demo
# up against it, and serves the demo on http://localhost:3007.
#
# The setup step is destructive and stays destructive here: it runs
# `db:reset`, so `kiosk_tudu_development` and `kiosk_tudu_test` are dropped
# and recreated on every `up`. What changes is WHERE — that database lives on
# the `pgdata` volume this file declares, so the drop cannot reach a Postgres
# on your machine.
#
# To run a command of this demo instead of the server, for example to list
# its routes:
#
#     docker compose run --rm app bin/rails routes
#
# The image is shared by every demo in this repository and is built from the
# Dockerfile one directory up. The kiosk gems are resolved from the repository
# root (`path '..'`), so the build context is the whole repository. The image
# holds every demo, so the two demos with an identity check can read the
# development key of the KYC demo in its directory.
name: kiosk-demo-tudu

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /kiosk/kiosk-demo-tudu
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The demo talks to the database in the service beside it. These are
      # written out rather than passed through from your shell on purpose: an
      # exported PGHOST does not reach in here and move the drop onto a server
      # of yours.
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: "3007"
    ports:
      # The port this demo's README tells an operator to open.
      - "3007:3007"

volumes:
  pgdata:
